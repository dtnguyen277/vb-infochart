<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Volleyball Open Gym</title>

<!-- =====================================================================
     DEFAULT SESSION CONFIG — you can also edit live via the Edit button.
     Live edits are saved to your browser (localStorage); use "Reset to
     file defaults" in the editor to clear them.
     ===================================================================== -->
<script>
const DEFAULT_CONFIG = {
  sessionTitle: "Sunday Open Gym",
  date: "May 25, 2026",
  subtitle: "",                  // optional: "7:00 - 9:00 PM" etc.

  // Schedule mode:
  //   "round-robin" — 3 rounds, each team plays each other once
  //   "king"        — Round 1 fixed; later rounds = winners on Court 1, losers on Court 2
  //   "manual"      — pairings fully under user control
  scheduleMode: "round-robin",

  courts: ["Close Court", "Far Court"],

  teams: [
    { name: "Red",    color: "#ef4444", roster: ["Alice","Ben","Chris","Dana","Eli","Evan"] },
    { name: "Blue",   color: "#3b82f6", roster: ["Frank","Grace","Henry","Ivy","Jay","Jess"] },
    { name: "Green",  color: "#22c55e", roster: ["Kara","Leo","Maya","Noah","Owen","Olivia"] },
    { name: "Yellow", color: "#eab308", roster: ["Pat","Quinn","Riley","Sam","Tara","Tom"] },
  ],

  // Leave matches: null to auto-generate round-robin from the 4 teams above.
  matches: null,

  rules: [
    "Sets to 21, cap 23",
    "King of the court",
    "3 min rest between sets",
  ],
};
</script>
<!-- ===================================================================== -->

<style>
  :root {
    --bg: #0b0f17;
    --panel: #121826;
    --panel-2: #182033;
    --border: #243049;
    --text: #f1f5f9;
    --muted: #7b8aa8;
    --accent: #e2e8f0;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", system-ui, sans-serif;
    overflow: hidden;
  }

  .stage {
    height: 100vh;
    width: 100vw;
    display: grid;
    grid-template-rows: 8vh auto 1fr;
    gap: 1.2vh;
    padding: 1.2vh 1.4vw;
  }

  /* ---------- HEADER ---------- */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 1.2vw;
    border-bottom: 1px solid var(--border);
  }
  .header .title-block { display: flex; flex-direction: column; gap: 0.4vh; }
  .header .title { font-size: 4vh; font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
  .header .subtitle {
    font-size: 1.6vh; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.18em;
  }
  .header .date-block {
    display: flex; flex-direction: column; align-items: flex-end; gap: 0.2vh;
    border-left: 2px solid var(--border);
    padding-left: 1.4vw;
  }
  .header .weekday {
    font-size: 1.6vh; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.22em;
    line-height: 1;
  }
  .header .date {
    font-size: 2.6vh; font-weight: 800; letter-spacing: -0.01em;
    color: var(--text); line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- TEAMS ROW ---------- */
  .teams {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1.2vw;
  }
  .team {
    --tint-strong: color-mix(in srgb, var(--team-color, var(--accent)) 22%, var(--panel));
    --tint-soft:   color-mix(in srgb, var(--team-color, var(--accent)) 10%, var(--panel));
    background: linear-gradient(180deg, var(--tint-strong) 0%, var(--tint-soft) 100%);
    border: 1px solid color-mix(in srgb, var(--team-color, var(--accent)) 45%, var(--border));
    border-radius: 1.4vh;
    padding: 0 1.6vw 1.8vh;
    display: flex; flex-direction: column;
    min-width: 0;
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 0 0 var(--team-color);
  }
  .team-header {
    background: var(--team-color, var(--accent));
    margin: 0 -1.6vw 1.6vh;
    padding: 1.6vh 1.6vw;
    display: flex; align-items: center; justify-content: space-between;
    gap: 0.8vw;
  }
  .team-name {
    font-size: 3vh; font-weight: 900; letter-spacing: 0.02em;
    text-transform: uppercase;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.25);
  }
  .team-wins {
    display: inline-flex; align-items: baseline; gap: 0.3vw;
    background: rgba(0, 0, 0, 0.32);
    color: #fff;
    padding: 0.5vh 0.9vw;
    border-radius: 0.6vh;
    font-variant-numeric: tabular-nums;
  }
  .team-wins .wins-num {
    font-size: 2.4vh; font-weight: 800;
    line-height: 1;
  }
  .team-wins .wins-label {
    font-size: 2vh;
    line-height: 1;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,0.4));
  }
  .roster {
    display: flex; flex-direction: column;
    gap: 0.6vh;
    list-style: none; padding: 0; margin: 0;
  }
  .roster li {
    font-size: 2.2vh;
    font-weight: 600;
    padding: 0.5vh 0;
    border-bottom: 1px dashed color-mix(in srgb, var(--team-color, var(--accent)) 35%, transparent);
    color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .roster li:last-child { border-bottom: none; }
  .roster li.empty { color: var(--muted); font-style: italic; font-weight: 400; }

  /* ---------- BOTTOM ROW: SCHEDULE + RULES ---------- */
  .bottom {
    display: grid;
    grid-template-columns: 2fr 3fr;
    gap: 1.2vw;
    min-height: 0;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 1.4vh;
    padding: 2vh 1.6vw;
    display: flex; flex-direction: column;
    min-width: 0; min-height: 0;
  }
  .panel-title {
    font-size: 2.2vh; font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 1.6vh;
  }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 0.8vw;
    margin-bottom: 1.6vh;
  }
  .panel-head .panel-title { margin-bottom: 0; }
  .edit-lineups-btn {
    background: transparent; color: var(--muted);
    border: 1px solid var(--border); border-radius: 0.6vh;
    padding: 0.5vh 0.9vw;
    font-size: 1.4vh; font-weight: 700;
    cursor: pointer; font-family: inherit;
    text-transform: uppercase; letter-spacing: 0.1em;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .edit-lineups-btn:hover:not(:disabled) { color: var(--text); border-color: var(--text); }
  .edit-lineups-btn.active {
    background: var(--accent); color: #0b0f17; border-color: var(--accent);
  }
  .edit-lineups-btn:disabled, .edit-lineups-btn.disabled {
    opacity: 0.4; cursor: not-allowed;
  }

  /* ---------- SCHEDULE ---------- */
  .schedule {
    flex: 1;
    display: grid;
    grid-template-columns: auto repeat(var(--court-count, 2), 1fr);
    gap: 0.4vh 1.2vw;
    align-content: start;
  }
  .sched-cell {
    display: flex; align-items: center;
    padding: 1.1vh 0.4vw;
    font-size: 2.4vh;
    border-bottom: 1px solid var(--border);
  }
  .sched-head {
    font-size: 1.6vh; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.1em;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0.8vh;
  }
  .sched-round {
    font-weight: 800; font-size: 2.6vh;
    color: var(--muted);
    justify-content: center;
    min-width: 4vw;
  }
  .match { display: flex; align-items: center; gap: 0.8vw; font-weight: 700; }
  .match .vs {
    color: var(--muted); font-weight: 500; font-size: 1.8vh;
    text-transform: uppercase; letter-spacing: 0.12em;
  }
  .match .team-chip {
    display: inline-flex; align-items: center; gap: 0.5vw;
    padding: 0.3vh 0.7vw;
    border-radius: 0.6vh;
    background: color-mix(in srgb, var(--team-color, var(--accent)) 18%, transparent);
    border: 1px solid color-mix(in srgb, var(--team-color, var(--accent)) 50%, transparent);
    position: relative;
    cursor: pointer;
    transition: filter 0.12s, transform 0.08s, background 0.12s;
    user-select: none;
  }
  .match .team-chip:hover {
    filter: brightness(1.18);
    background: color-mix(in srgb, var(--team-color, var(--accent)) 28%, transparent);
  }
  .match .team-chip:active { transform: scale(0.97); }
  .match .team-chip .team-dot {
    width: 1.2vh; height: 1.2vh;
    background: var(--team-color, var(--accent));
    border-radius: 50%;
  }
  .match .team-chip.winner {
    background: color-mix(in srgb, var(--team-color, var(--accent)) 32%, transparent);
    border-color: color-mix(in srgb, var(--team-color, var(--accent)) 80%, transparent);
    box-shadow: 0 0 0 0.2vh color-mix(in srgb, var(--team-color, var(--accent)) 28%, transparent);
  }
  .match .team-chip .trophy {
    font-size: 1.8vh; line-height: 1;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,0.4));
  }
  .match .tbd-chip {
    display: inline-flex; align-items: center;
    padding: 0.3vh 0.9vw;
    border-radius: 0.6vh;
    background: transparent;
    border: 1px dashed var(--border);
    color: var(--muted);
    font-weight: 700;
    font-size: 1.8vh;
    letter-spacing: 0.12em;
  }
  .match .blank {
    color: var(--border);
    font-weight: 700;
    font-size: 2.4vh;
    padding: 0 0.4vw;
  }
  .sched-cell.match-blank {
    grid-column: span 1;
    justify-content: center;
    color: var(--border);
    font-style: italic;
    font-size: 2vh;
  }
  .add-round-main {
    align-self: center;
    margin: 1vh auto 0;
    width: 3.6vh; height: 3.6vh;
    border-radius: 50%;
    background: transparent;
    color: var(--muted);
    border: 1px dashed var(--border);
    cursor: pointer;
    font: inherit;
    font-size: 2.4vh; font-weight: 700; line-height: 1;
    padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    transition: color 0.15s, border-color 0.15s, background 0.15s;
  }
  .add-round-main:hover {
    color: var(--text);
    border-color: var(--text);
    background: rgba(255,255,255,0.05);
  }
  .match .blank.clickable, .match .tbd-chip.clickable {
    cursor: pointer;
    transition: color 0.12s, border-color 0.12s, background 0.12s;
  }
  .match .blank.clickable {
    border: 1px dashed var(--border);
    border-radius: 0.6vh;
    padding: 0.3vh 0.9vw;
    color: var(--muted);
    font-size: 2vh; font-weight: 700;
  }
  .match .blank.clickable:hover { color: var(--text); border-color: var(--text); }
  .match .tbd-chip.clickable:hover {
    color: var(--text); border-color: var(--text);
  }
  .match .clear-match-btn {
    margin-left: 0.6vw;
    width: 2.4vh; height: 2.4vh;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 0.4vh;
    cursor: pointer;
    font: inherit;
    font-size: 1.6vh; line-height: 1;
    padding: 0;
  }
  .match .clear-match-btn:hover {
    color: #f87171; border-color: #7f1d1d;
  }

  /* ---------- TEAM PICKER POPOVER ---------- */
  .team-picker {
    position: fixed;
    z-index: 50;
    background: #182033;
    border: 1px solid var(--border);
    border-radius: 0.8vh;
    padding: 4px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.55);
    min-width: 160px;
    font-size: 14px;
    font-family: inherit;
  }
  .team-picker-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px;
    cursor: pointer;
    border-radius: 6px;
    color: var(--text);
    user-select: none;
  }
  .team-picker-item:hover { background: rgba(255, 255, 255, 0.08); }
  .team-picker-item.selected { background: rgba(255, 255, 255, 0.05); }
  .team-picker-item .picker-dot {
    width: 11px; height: 11px; border-radius: 50%;
    background: var(--picker-color, transparent);
    border: 1px solid color-mix(in srgb, var(--picker-color, var(--border)) 60%, var(--border));
    flex-shrink: 0;
  }
  .team-picker-item:not(.has-color) .picker-dot {
    background: transparent; border-style: dashed;
  }
  .team-picker-item.tbd-row .picker-dot {
    background: repeating-linear-gradient(45deg, var(--muted) 0 2px, transparent 2px 4px);
    border-color: var(--muted);
  }

  /* ---------- RULES ---------- */
  .rules {
    flex: 1;
    list-style: none; padding: 0; margin: 0;
    display: flex; flex-direction: column;
    gap: 1.2vh;
  }
  .rules li {
    font-size: 2.2vh;
    line-height: 1.35;
    padding-left: 1.6vw;
    position: relative;
  }
  .rules li::before {
    content: "";
    position: absolute;
    left: 0; top: 1.1vh;
    width: 0.7vh; height: 0.7vh;
    background: var(--accent);
    border-radius: 50%;
  }

  /* ---------- EDITOR ---------- */
  .edit-btn {
    position: fixed;
    bottom: 1.6vh; right: 1.6vh;
    z-index: 10;
    width: 4.2vh; height: 4.2vh;
    display: inline-flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.12);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 50%;
    cursor: pointer;
    opacity: 0.6;
    transition: opacity 0.2s, color 0.2s, background 0.2s, transform 0.2s;
    font-family: inherit;
    padding: 0;
  }
  .edit-btn:hover {
    opacity: 1;
    color: var(--text);
    background: rgba(255,255,255,0.2);
    transform: scale(1.05);
  }
  .edit-btn svg { width: 2vh; height: 2vh; display: block; }

  .editor-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 20;
    display: none;
  }
  .editor-overlay.open { display: block; }

  .editor {
    position: fixed;
    top: 0; right: 0;
    width: min(560px, 100vw);
    height: 100vh;
    height: 100dvh; /* mobile-safe — accounts for URL bar */
    background: var(--panel);
    border-left: 1px solid var(--border);
    z-index: 21;
    display: none;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.2s ease-out;
    font-size: 14px;
  }
  .editor.open { display: flex; transform: translateX(0); }

  .editor-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }
  .editor-head h2 { margin: 0; font-size: 18px; font-weight: 700; }
  .editor-head button {
    background: transparent; color: var(--muted);
    border: none; font-size: 22px; cursor: pointer; line-height: 1;
  }
  .editor-body {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    padding: 16px 20px 100px;
  }
  /* When the editor is open, lock background scrolling. */
  body.editor-open { overflow: hidden !important; }
  body.editor-open .stage { pointer-events: none; }
  body.editor-open .editor { pointer-events: auto; }
  body.editor-open .editor-overlay { pointer-events: auto; }
  .editor-foot {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 14px 20px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    display: flex; gap: 10px; justify-content: space-between;
  }
  .editor-foot .left { display: flex; gap: 8px; }
  .editor-foot .right { display: flex; gap: 8px; }

  .ed-section { margin-bottom: 22px; }
  .ed-section h3 {
    margin: 0 0 10px;
    font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--muted);
  }
  .ed-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
  .ed-row label { width: 80px; font-size: 12px; color: var(--muted); }
  .ed-row input[type="text"], .ed-row input[type="color"] {
    flex: 1; min-width: 0;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 10px;
    font: inherit;
  }
  .ed-row input[type="color"] {
    width: 44px; height: 32px; padding: 2px; flex: 0 0 44px; cursor: pointer;
  }

  .team-edit {
    background: var(--bg);
    border: 1px solid var(--border);
    border-left: 4px solid var(--team-color, var(--accent));
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .team-edit-head { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  .team-edit-head input[type="text"] {
    flex: 1; font-weight: 700;
    background: transparent; color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 10px; font-size: 13px;
  }
  .roster-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .roster-grid input {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px; font: inherit; min-width: 0;
  }

  .rules-list { display: flex; flex-direction: column; gap: 6px; }
  .rule-row { display: flex; gap: 6px; }
  .rule-row input {
    flex: 1; min-width: 0;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 10px; font: inherit;
  }
  .rule-row button, .add-rule, .add-round {
    background: transparent; color: var(--muted);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 4px 10px; cursor: pointer; font: inherit;
  }
  .rule-row button:hover, .add-rule:hover, .add-round:hover {
    color: var(--text); border-color: var(--text);
  }
  .add-rule, .add-round { align-self: flex-start; margin-top: 6px; font-size: 12px; }

  /* Schedule editor */
  .mode-picker {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
    margin-bottom: 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px;
  }
  .mode-btn {
    background: transparent;
    color: var(--muted);
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 8px 6px;
    font: inherit;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
    text-align: center;
    line-height: 1.2;
  }
  .mode-btn:hover { color: var(--text); }
  .mode-btn.active {
    background: var(--panel-2);
    color: var(--text);
    border-color: var(--border);
  }
  .mode-explainer {
    color: var(--muted);
    font-size: 12px;
    line-height: 1.4;
    padding: 4px 2px;
    font-style: italic;
  }
  .round-edit {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .round-edit-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px;
    font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--muted);
  }
  .round-edit-head .round-label { color: var(--text); font-size: 13px; }
  .round-edit-head button {
    background: transparent; color: var(--muted);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 2px 8px; cursor: pointer; font: inherit; font-size: 11px;
  }
  .round-edit-head button:hover { color: #f87171; border-color: #7f1d1d; }
  .court-row {
    display: grid;
    grid-template-columns: 70px 1fr auto 1fr auto;
    gap: 6px;
    align-items: center;
    margin-bottom: 6px;
  }
  .court-row .clear-match {
    background: transparent; color: var(--muted);
    border: 1px solid var(--border); border-radius: 6px;
    width: 26px; height: 26px;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; font: inherit; font-size: 14px; line-height: 1;
    padding: 0;
  }
  .court-row .clear-match:hover { color: #f87171; border-color: #7f1d1d; }
  .court-row .clear-match:disabled { opacity: 0.3; cursor: default; }
  .court-row .clear-match:disabled:hover { color: var(--muted); border-color: var(--border); }

  .winner-row {
    display: flex; align-items: center; gap: 6px;
    margin: 0 0 8px 76px;
    font-size: 11px;
  }
  .winner-row .winner-label {
    color: var(--muted); font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.08em;
  }
  .winner-row .win-btn {
    background: transparent; color: var(--muted);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 3px 8px; cursor: pointer; font: inherit; font-size: 11px;
    font-weight: 700;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .winner-row .win-btn:hover:not(:disabled) { color: var(--text); border-color: var(--text); }
  .winner-row .win-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .winner-row .win-btn.active {
    background: var(--win-color, var(--accent));
    border-color: var(--win-color, var(--accent));
    color: #0b0f17;
  }
  .winner-row .win-btn .swatch {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--win-color, var(--accent));
    border: 1px solid rgba(0,0,0,0.25);
  }
  .winner-row .win-btn.active .swatch { background: rgba(0,0,0,0.35); border-color: transparent; }
  .winner-row .win-none { opacity: 0.8; }
  .court-row:last-child { margin-bottom: 0; }
  .court-row .court-label {
    font-size: 11px; font-weight: 600;
    color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.08em;
  }
  .slot-wrap {
    position: relative;
    display: flex; align-items: center;
    min-width: 0;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding-left: 8px;
    transition: border-color 0.15s;
  }
  .slot-wrap.has-color { border-color: color-mix(in srgb, var(--slot-color, var(--border)) 55%, var(--border)); }
  .slot-swatch {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--slot-color, transparent);
    border: 1px solid color-mix(in srgb, var(--slot-color, var(--border)) 60%, var(--border));
    flex-shrink: 0;
  }
  .slot-wrap.empty .slot-swatch { background: transparent; border-style: dashed; }
  .slot-wrap.tbd .slot-swatch {
    background: repeating-linear-gradient(45deg, var(--muted) 0 2px, transparent 2px 4px);
    border-color: var(--muted);
  }
  .slot-wrap select {
    flex: 1; min-width: 0;
    background: transparent;
    color: var(--text);
    border: none;
    padding: 6px 8px; font: inherit;
    appearance: none; -webkit-appearance: none;
    cursor: pointer;
  }
  .slot-wrap select:focus { outline: none; }
  .court-row .vs-lbl {
    font-size: 11px; color: var(--muted); font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.08em;
    text-align: center; padding: 0 4px;
  }
  .sched-actions {
    display: flex; gap: 8px; margin-top: 8px;
  }
  .btn.ghost {
    background: transparent; color: var(--muted);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 4px 10px; cursor: pointer; font: inherit; font-size: 12px;
  }
  .btn.ghost:hover { color: var(--text); border-color: var(--text); }
  .btn.ghost.danger:hover { color: #f87171; border-color: #7f1d1d; }

  .btn {
    background: var(--accent); color: #0b0f17;
    border: none; border-radius: 6px;
    padding: 9px 14px; font-weight: 700; cursor: pointer; font: inherit;
    font-size: 13px;
  }
  .btn.secondary {
    background: transparent; color: var(--text);
    border: 1px solid var(--border);
  }
  .btn.danger { background: transparent; color: #f87171; border: 1px solid #7f1d1d; }
  .btn:hover { filter: brightness(1.05); }

  /* Import / Export */
  .io-section textarea {
    width: 100%;
    height: 180px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    font: 12px/1.4 ui-monospace, "Cascadia Code", Consolas, monospace;
    resize: vertical;
    white-space: pre;
    overflow: auto;
  }
  .io-actions {
    display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap;
  }
  .io-status {
    font-size: 11px; margin-top: 8px;
    min-height: 14px;
    color: var(--muted);
  }
  .io-status.ok  { color: #4ade80; }
  .io-status.err { color: #f87171; }
  .io-hint {
    font-size: 11px; color: var(--muted);
    margin-bottom: 6px;
  }

  @media print { .edit-btn, .editor-overlay, .editor { display: none !important; } }

  /* ---------- MOBILE ---------- */
  /* On phones / narrow screens, drop the fixed-viewport TV layout and let the
     page scroll. Stack teams 2x2 and stack schedule above rules. */
  @media (max-width: 900px) {
    html, body { overflow: auto; height: auto; }
    body { -webkit-text-size-adjust: 100%; }

    .stage {
      height: auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 14px;
      gap: 14px;
    }

    .header {
      padding: 0 0 12px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .header .title { font-size: 22px; }
    .header .subtitle { font-size: 10px; }
    .header .date-block { padding-left: 12px; }
    .header .weekday { font-size: 10px; }
    .header .date { font-size: 15px; }

    .teams {
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .team { border-radius: 10px; padding: 0 12px 12px; }
    .team-header { margin: 0 -12px 10px; padding: 10px 12px; }
    .team-name { font-size: 15px; }
    .team-wins { padding: 4px 8px; border-radius: 6px; }
    .team-wins .wins-num { font-size: 15px; }
    .team-wins .wins-label { font-size: 14px; }
    .roster li { font-size: 13px; padding: 4px 0; }

    .bottom { grid-template-columns: 1fr; gap: 10px; }
    .panel { border-radius: 10px; padding: 14px; }
    .panel-head { margin-bottom: 10px; }
    .panel-title { font-size: 12px; }

    .schedule { gap: 8px 10px; }
    .sched-cell { font-size: 13px; padding: 6px 2px; }
    .sched-head { font-size: 10px; padding-bottom: 6px; }
    .sched-round { font-size: 13px; min-width: 28px; align-self: center; }
    /* Stack each match vertically so chips never wrap mid-name. */
    .sched-cell.match {
      flex-direction: column;
      align-items: stretch;
      gap: 3px;
      padding: 6px 0;
    }
    .match .team-chip,
    .match .tbd-chip,
    .match .blank.clickable {
      width: 100%;
      justify-content: flex-start;
    }
    .match .team-chip { font-size: 13px; padding: 4px 8px; gap: 6px; border-radius: 5px; }
    .match .team-chip .team-dot { width: 7px; height: 7px; }
    .match .team-chip.winner { box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--team-color, var(--accent)) 28%, transparent); }
    .match .vs {
      font-size: 9px;
      text-align: center;
      align-self: center;
      letter-spacing: 0.18em;
    }
    .match .trophy { font-size: 12px; }
    .match .tbd-chip { font-size: 11px; padding: 4px 8px; }
    .match .blank { font-size: 14px; }
    .match .blank.clickable { font-size: 14px; padding: 3px 8px; border-radius: 5px; }
    .match .clear-match-btn {
      width: 22px; height: 22px; font-size: 13px; border-radius: 4px;
      align-self: flex-end;
      margin-left: 0;
    }

    .rules { gap: 8px; }
    .rules li { font-size: 13px; padding-left: 14px; line-height: 1.4; }
    .rules li::before { width: 5px; height: 5px; top: 7px; }

    .edit-btn {
      width: 38px; height: 38px;
      bottom: 12px; right: 12px;
    }
    .edit-btn svg { width: 17px; height: 17px; }
    .edit-lineups-btn { font-size: 10px; padding: 5px 8px; }
    .add-round-main { width: 32px; height: 32px; font-size: 20px; margin-top: 8px; }

    .editor { width: 100vw; }
  }
</style>
</head>
<body>

<div class="stage" id="stage"></div>

<button class="edit-btn" id="editBtn" title="Edit session" aria-label="Edit session">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 20h9"/>
    <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
  </svg>
</button>

<div class="editor-overlay" id="editorOverlay"></div>
<aside class="editor" id="editor">
  <div class="editor-head">
    <h2>Edit Session</h2>
    <button id="closeEditor" title="Close">×</button>
  </div>
  <div class="editor-body" id="editorBody"></div>
  <div class="editor-foot">
    <div class="left">
      <button class="btn danger" id="resetBtn">Reset to file defaults</button>
    </div>
    <div class="right">
      <button class="btn secondary" id="cancelBtn">Cancel</button>
      <button class="btn" id="saveBtn">Save</button>
    </div>
  </div>
</aside>

<script>
  // ============ STATE ============
  const STORAGE_KEY = "vb-opengym-config";

  // Normalize a pairing to { teams: [a, b], winner: null | 0 | 1 }.
  // Accepts legacy array shape [a, b]. Empty slots are migrated to "TBD".
  function normalizePairing(p) {
    const slot = v => (!v ? "TBD" : v);
    if (!p) return { teams: ["TBD", "TBD"], winner: null };
    if (Array.isArray(p)) return { teams: [slot(p[0]), slot(p[1])], winner: null };
    const teams = [slot(p.teams?.[0]), slot(p.teams?.[1])];
    const w = (p.winner === 0 || p.winner === 1) ? p.winner : null;
    const valid = w !== null && teams[w] && teams[w] !== "TBD";
    return { teams, winner: valid ? w : null };
  }
  function normalizeMatches(matches) {
    if (matches == null) return null;
    return matches.map((m, i) => ({
      round: m.round ?? i + 1,
      pairings: (m.pairings || []).map(normalizePairing),
    }));
  }
  function normalizeConfig(cfg) {
    cfg.matches = normalizeMatches(cfg.matches);
    // Backward-compat: if scheduleMode missing, infer from matches.
    if (cfg.scheduleMode !== "round-robin" && cfg.scheduleMode !== "king" && cfg.scheduleMode !== "manual") {
      cfg.scheduleMode = cfg.matches == null ? "round-robin" : "manual";
    }
    return cfg;
  }

  const SCHEDULE_MODES = ["round-robin", "king", "manual"];
  const SCHEDULE_MODE_LABELS = {
    "round-robin": "Round robin",
    "king":        "King of the court",
    "manual":      "Manual",
  };
  function getScheduleMode() {
    return SCHEDULE_MODES.includes(CONFIG.scheduleMode)
      ? CONFIG.scheduleMode
      : "round-robin";
  }

  // Build an explicit matches array from the current round-robin schedule.
  function materializeFromRoundRobin() {
    return generateRoundRobin(CONFIG.teams).map(m => ({
      round: m.round,
      pairings: m.pairings.map(p => ({ teams: [...p.teams], winner: null })),
    }));
  }

  // Initial King of the Court schedule: 3 rounds, Round 1 = T1 vs T2 / T3 vs T4,
  // Rounds 2+ filled with TBD until prior winners are set.
  function buildKingInitial(numRounds = 3) {
    const names = CONFIG.teams.map(t => t.name);
    const [a, b, c, d] = [names[0] ?? "TBD", names[1] ?? "TBD", names[2] ?? "TBD", names[3] ?? "TBD"];
    const out = [{
      round: 1,
      pairings: [
        { teams: [a, b], winner: null },
        { teams: [c, d], winner: null },
      ],
    }];
    for (let r = 2; r <= numRounds; r++) {
      out.push({
        round: r,
        pairings: [
          { teams: ["TBD", "TBD"], winner: null },
          { teams: ["TBD", "TBD"], winner: null },
        ],
      });
    }
    return out;
  }

  // Walk through king-of-the-court rounds and rewrite each later round's
  // pairings based on the previous round's winners/losers. If a later round's
  // expected teams change, its winner is cleared.
  function recomputeKingDownstream() {
    if (getScheduleMode() !== "king" || !CONFIG.matches) return;
    for (let i = 0; i < CONFIG.matches.length - 1; i++) {
      const curr = CONFIG.matches[i];
      const next = CONFIG.matches[i + 1];
      const [p0, p1] = curr.pairings;
      let newC1, newC2;
      if (p0.winner == null || p1.winner == null) {
        newC1 = ["TBD", "TBD"];
        newC2 = ["TBD", "TBD"];
      } else {
        const c1w = p0.teams[p0.winner];
        const c1l = p0.teams[1 - p0.winner];
        const c2w = p1.teams[p1.winner];
        const c2l = p1.teams[1 - p1.winner];
        newC1 = [c1w, c2w];
        newC2 = [c1l, c2l];
      }
      const same = (a, b) => a[0] === b[0] && a[1] === b[1];
      if (!same(newC1, next.pairings[0].teams)) {
        next.pairings[0] = { teams: newC1, winner: null };
      }
      if (!same(newC2, next.pairings[1].teams)) {
        next.pairings[1] = { teams: newC2, winner: null };
      }
    }
  }

  function setScheduleMode(newMode) {
    const old = getScheduleMode();
    if (old === newMode) return;
    CONFIG.scheduleMode = newMode;
    if (newMode === "round-robin") {
      // Drop stored matches so the view recomputes from teams.
      CONFIG.matches = null;
    } else if (newMode === "king") {
      CONFIG.matches = buildKingInitial();
    } else if (newMode === "manual") {
      // Keep existing matches if any, otherwise materialize round-robin as a seed.
      if (CONFIG.matches == null) CONFIG.matches = materializeFromRoundRobin();
    }
    saveConfig(CONFIG);
  }

  function loadConfig() {
    try {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) return normalizeConfig(JSON.parse(stored));
    } catch (e) { console.warn("Bad stored config, using defaults", e); }
    return normalizeConfig(structuredClone(DEFAULT_CONFIG));
  }
  function saveConfig(cfg) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg));
  }
  function clearConfig() { localStorage.removeItem(STORAGE_KEY); }

  let CONFIG = loadConfig();
  let DRAFT = null; // working copy while editor is open
  let mainEditMode = false; // when true, clicks on chips open team picker instead of toggling winner
  let activePicker = null;
  let pendingIoStatus = null; // {msg, kind} surviving across renderEditor() calls

  function materializeMatchesIfAuto() {
    if (CONFIG.matches != null) return;
    if (getScheduleMode() === "king") {
      CONFIG.matches = buildKingInitial();
    } else {
      CONFIG.matches = materializeFromRoundRobin();
    }
  }

  function setSlotValue(roundIdx, pairingIdx, slotIdx, value) {
    materializeMatchesIfAuto();
    const pair = normalizePairing(CONFIG.matches[roundIdx].pairings[pairingIdx]);
    CONFIG.matches[roundIdx].pairings[pairingIdx] = pair;
    pair.teams[slotIdx] = value;
    if (pair.winner === slotIdx && (!value || value === "TBD")) pair.winner = null;
    recomputeKingDownstream();
    saveConfig(CONFIG);
    render();
  }

  function clearMatchFromMain(roundIdx, pairingIdx) {
    materializeMatchesIfAuto();
    CONFIG.matches[roundIdx].pairings[pairingIdx] = { teams: ["TBD", "TBD"], winner: null };
    recomputeKingDownstream();
    saveConfig(CONFIG);
    render();
  }

  function addRoundFromMain() {
    materializeMatchesIfAuto();
    // Round-robin is a fixed 3-round structure; extending it means we're
    // customizing — flip to manual so the mode label stays honest.
    if (getScheduleMode() === "round-robin") CONFIG.scheduleMode = "manual";
    const nextRoundNumber = CONFIG.matches.length + 1;
    CONFIG.matches.push({
      round: nextRoundNumber,
      pairings: CONFIG.courts.map(() => ({ teams: ["TBD", "TBD"], winner: null })),
    });
    recomputeKingDownstream();
    saveConfig(CONFIG);
    render();
  }

  function closeTeamPicker() {
    if (!activePicker) return;
    activePicker.remove();
    document.removeEventListener("mousedown", outsidePickerHandler, true);
    document.removeEventListener("keydown", pickerKeyHandler, true);
    activePicker = null;
  }
  function outsidePickerHandler(e) {
    if (activePicker && !activePicker.contains(e.target)) closeTeamPicker();
  }
  function pickerKeyHandler(e) {
    if (e.key === "Escape") closeTeamPicker();
  }

  function openTeamPicker(anchorEl, currentValue, onPick) {
    closeTeamPicker();
    const picker = el("div", { class: "team-picker" });
    const opts = [
      { value: "TBD", label: "TBD", color: null, cls: "tbd-row" },
      ...CONFIG.teams.map(t => ({ value: t.name, label: t.name, color: t.color, cls: "has-color" })),
    ];
    for (const o of opts) {
      const isSelected = (currentValue ?? "") === o.value;
      const item = el("div", {
        class: "team-picker-item " + o.cls + (isSelected ? " selected" : ""),
        onclick: (e) => { e.stopPropagation(); closeTeamPicker(); onPick(o.value); },
      });
      if (o.color) item.style.setProperty("--picker-color", o.color);
      item.appendChild(el("span", { class: "picker-dot" }));
      item.appendChild(el("span", {}, o.label));
      picker.appendChild(item);
    }
    document.body.appendChild(picker);

    const rect = anchorEl.getBoundingClientRect();
    const pRect = picker.getBoundingClientRect();
    let left = rect.left;
    let top = rect.bottom + 6;
    if (left + pRect.width > window.innerWidth - 8) left = window.innerWidth - pRect.width - 8;
    if (top + pRect.height > window.innerHeight - 8) top = rect.top - pRect.height - 6;
    if (left < 8) left = 8;
    if (top < 8) top = 8;
    picker.style.left = left + "px";
    picker.style.top = top + "px";

    activePicker = picker;
    setTimeout(() => {
      document.addEventListener("mousedown", outsidePickerHandler, true);
      document.addEventListener("keydown", pickerKeyHandler, true);
    }, 0);
  }

  // ============ HELPERS ============
  const $ = (sel, root = document) => root.querySelector(sel);
  const el = (tag, attrs = {}, ...children) => {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "style") {
        for (const [sk, sv] of Object.entries(v)) {
          if (sk.startsWith("--")) node.style.setProperty(sk, sv);
          else node.style[sk] = sv;
        }
      }
      else if (k === "class") node.className = v;
      else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, v);
    }
    for (const c of children.flat()) {
      if (c == null || c === false) continue;
      node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    }
    return node;
  };
  const teamByName = (name) => CONFIG.teams.find(t => t.name === name);

  function generateRoundRobin(teams) {
    if (teams.length !== 4) {
      console.warn("Auto round-robin assumes 4 teams.");
      return [];
    }
    const [a, b, c, d] = teams.map(t => t.name);
    const mk = (x, y) => ({ teams: [x, y], winner: null });
    return [
      { round: 1, pairings: [mk(a, b), mk(c, d)] },
      { round: 2, pairings: [mk(a, c), mk(b, d)] },
      { round: 3, pairings: [mk(a, d), mk(b, c)] },
    ];
  }

  // ============ RENDER ============
  function deriveWeekday(dateStr) {
    if (!dateStr) return "";
    const d = new Date(dateStr);
    if (Number.isNaN(d.getTime())) return "";
    return d.toLocaleDateString(undefined, { weekday: "long" });
  }

  function renderHeader() {
    const titleBlock = el("div", { class: "title-block" },
      el("div", { class: "title" }, CONFIG.sessionTitle),
      CONFIG.subtitle ? el("div", { class: "subtitle" }, CONFIG.subtitle) : null,
    );

    const weekday = deriveWeekday(CONFIG.date);
    const dateBlock = el("div", { class: "date-block" });
    if (weekday) dateBlock.appendChild(el("div", { class: "weekday" }, weekday));
    if (CONFIG.date) dateBlock.appendChild(el("div", { class: "date" }, CONFIG.date));

    return el("header", { class: "header" }, titleBlock, dateBlock);
  }

  function computeWinTotals() {
    const totals = Object.fromEntries(CONFIG.teams.map(t => [t.name, 0]));
    const matches = CONFIG.matches ?? generateRoundRobin(CONFIG.teams);
    for (const m of matches) {
      for (const p of (m.pairings || [])) {
        const pair = normalizePairing(p);
        if (pair.winner == null) continue;
        const winnerName = pair.teams[pair.winner];
        if (winnerName in totals) totals[winnerName]++;
      }
    }
    return totals;
  }

  function renderTeams() {
    const wrap = el("section", { class: "teams" });
    const wins = computeWinTotals();
    for (const t of CONFIG.teams) {
      const roster = el("ul", { class: "roster" });
      for (let i = 0; i < 6; i++) {
        const name = t.roster[i];
        roster.appendChild(name
          ? el("li", {}, name)
          : el("li", { class: "empty" }, "—"));
      }
      const card = el("div", { class: "team", style: { "--team-color": t.color } },
        el("div", { class: "team-header" },
          el("span", { class: "team-name" }, t.name),
          el("span", { class: "team-wins", title: `${wins[t.name] ?? 0} win${(wins[t.name] ?? 0) === 1 ? "" : "s"}` },
            el("span", { class: "wins-label" }, "🏆"),
            el("span", { class: "wins-num" }, String(wins[t.name] ?? 0)),
          ),
        ),
        roster
      );
      wrap.appendChild(card);
    }
    return wrap;
  }

  function toggleWinnerFromMain(roundIdx, pairingIdx, slotIdx) {
    materializeMatchesIfAuto();
    const pair = normalizePairing(CONFIG.matches[roundIdx].pairings[pairingIdx]);
    CONFIG.matches[roundIdx].pairings[pairingIdx] = pair;
    pair.winner = pair.winner === slotIdx ? null : slotIdx;
    recomputeKingDownstream();
    saveConfig(CONFIG);
    render();
  }

  // Slot value: "" (blank), "TBD", or a team name.
  // onClick: if present, slot becomes clickable (and blank/TBD slots get a "clickable" hover).
  function renderSlot(value, isWinner, onClick, opts = {}) {
    if (!value) {
      const attrs = { class: "blank" + (onClick ? " clickable" : "") };
      if (onClick) { attrs.onclick = onClick; attrs.title = "Click to add a team"; }
      return el("span", attrs, onClick ? "+" : "—");
    }
    if (value === "TBD") {
      const attrs = { class: "tbd-chip" + (onClick ? " clickable" : "") };
      if (onClick) { attrs.onclick = onClick; attrs.title = "Click to change"; }
      return el("span", attrs, "TBD");
    }
    const t = teamByName(value);
    const color = t ? t.color : "var(--accent)";
    const attrs = {
      class: "team-chip" + (isWinner ? " winner" : ""),
      style: { "--team-color": color },
    };
    if (onClick) {
      attrs.onclick = onClick;
      attrs.title = opts.titleOverride
        ?? (isWinner ? `Click to unmark ${value} as winner` : `Click to mark ${value} as winner`);
    }
    const chip = el("span", attrs);
    if (isWinner) chip.appendChild(el("span", { class: "trophy" }, "🏆"));
    chip.appendChild(el("span", { class: "team-dot" }));
    chip.appendChild(el("span", {}, value));
    return chip;
  }

  function renderSchedule() {
    const matches = CONFIG.matches ?? generateRoundRobin(CONFIG.teams);
    const courts = CONFIG.courts;
    const editing = mainEditMode;

    const grid = el("div", { class: "schedule",
      style: { "--court-count": courts.length } });

    grid.appendChild(el("div", { class: "sched-head" }, "Round"));
    for (const c of courts) grid.appendChild(el("div", { class: "sched-head" }, c));

    matches.forEach((m, ri) => {
      grid.appendChild(el("div", { class: "sched-cell sched-round" }, "R" + m.round));
      for (let i = 0; i < courts.length; i++) {
        const pair = normalizePairing(m.pairings[i]);
        const [a, b] = pair.teams;

        // In broadcast (non-editing) mode, fully-empty matches collapse to a single em-dash.
        if (!editing && !a && !b) {
          grid.appendChild(el("div", { class: "sched-cell match-blank" }, "—"));
          continue;
        }

        const cell = el("div", { class: "sched-cell match" });

        function slotClick(slotIdx) {
          return (e) => {
            e.stopPropagation();
            const cur = pair.teams[slotIdx];
            if (editing) {
              openTeamPicker(e.currentTarget, cur,
                v => setSlotValue(ri, i, slotIdx, v));
            } else if (cur && cur !== "TBD") {
              toggleWinnerFromMain(ri, i, slotIdx);
            }
          };
        }

        // In edit mode, every slot (incl. blank and TBD) is clickable.
        // In broadcast mode, only real team chips are clickable (for winner).
        const clickA = editing ? slotClick(0) : ((a && a !== "TBD") ? slotClick(0) : null);
        const clickB = editing ? slotClick(1) : ((b && b !== "TBD") ? slotClick(1) : null);

        const titleOverride = editing ? "Click to change team" : undefined;
        cell.appendChild(renderSlot(a, pair.winner === 0, clickA, { titleOverride }));
        cell.appendChild(el("span", { class: "vs" }, "vs"));
        cell.appendChild(renderSlot(b, pair.winner === 1, clickB, { titleOverride }));

        if (editing) {
          cell.appendChild(el("button", {
            class: "clear-match-btn",
            title: "Clear this match",
            onclick: (e) => { e.stopPropagation(); clearMatchFromMain(ri, i); },
          }, "×"));
        }

        grid.appendChild(cell);
      }
    });

    const mode = getScheduleMode();
    const canEditLineups = mode === "manual";

    const addRoundBtn = el("button", {
      class: "add-round-main",
      title: "Add another round",
      onclick: () => addRoundFromMain(),
    }, "+");

    return el("section", { class: "panel" },
      el("div", { class: "panel-head" },
        el("div", { class: "panel-title" }, "Match Schedule"),
        el("button", {
          class: "edit-lineups-btn" + (editing ? " active" : "") + (canEditLineups ? "" : " disabled"),
          title: canEditLineups
            ? (editing ? "Stop editing" : "Edit team lineups")
            : "Switch schedule mode to Manual in the editor to edit lineups",
          ...(canEditLineups ? {} : { disabled: "disabled" }),
          onclick: () => {
            if (!canEditLineups) return;
            mainEditMode = !mainEditMode;
            closeTeamPicker();
            render();
          },
        }, editing ? "Done" : "Edit lineups"),
      ),
      grid,
      addRoundBtn,
    );
  }

  function renderRules() {
    const list = el("ul", { class: "rules" });
    for (const r of CONFIG.rules) list.appendChild(el("li", {}, r));
    return el("section", { class: "panel" },
      el("div", { class: "panel-title" }, "Rules"),
      list
    );
  }

  function render() {
    closeTeamPicker();
    const stage = $("#stage");
    stage.innerHTML = "";
    stage.appendChild(renderHeader());
    stage.appendChild(renderTeams());
    stage.appendChild(el("div", { class: "bottom" }, renderRules(), renderSchedule()));
  }

  // ============ EDITOR ============
  function openEditor() {
    DRAFT = structuredClone(CONFIG);
    renderEditor();
    document.body.classList.add("editor-open");
    $("#editor").classList.add("open");
    $("#editorOverlay").classList.add("open");
  }
  function closeEditor() {
    DRAFT = null;
    pendingIoStatus = null;
    document.body.classList.remove("editor-open");
    $("#editor").classList.remove("open");
    $("#editorOverlay").classList.remove("open");
  }

  function input(value, onInput, opts = {}) {
    return el("input", {
      type: opts.type || "text",
      value: value ?? "",
      placeholder: opts.placeholder || "",
      oninput: (e) => onInput(e.target.value),
    });
  }

  function renderEditor() {
    const body = $("#editorBody");
    body.innerHTML = "";

    // Session
    const sessionSec = el("div", { class: "ed-section" },
      el("h3", {}, "Session"),
      el("div", { class: "ed-row" },
        el("label", {}, "Title"),
        input(DRAFT.sessionTitle, v => DRAFT.sessionTitle = v)),
      el("div", { class: "ed-row" },
        el("label", {}, "Date"),
        input(DRAFT.date, v => DRAFT.date = v, { placeholder: "May 25, 2026" })),
      el("div", { class: "ed-row" },
        el("label", {}, "Subtitle"),
        input(DRAFT.subtitle, v => DRAFT.subtitle = v, { placeholder: "7:00 - 9:00 PM (optional)" })),
    );
    body.appendChild(sessionSec);

    // Courts
    const courtsSec = el("div", { class: "ed-section" }, el("h3", {}, "Courts"));
    DRAFT.courts.forEach((c, i) => {
      courtsSec.appendChild(el("div", { class: "ed-row" },
        el("label", {}, "Court " + (i + 1)),
        input(c, v => DRAFT.courts[i] = v)));
    });
    body.appendChild(courtsSec);

    // Teams
    const teamsSec = el("div", { class: "ed-section" }, el("h3", {}, "Teams & Rosters"));
    DRAFT.teams.forEach((team, ti) => {
      const rosterInputs = el("div", { class: "roster-grid" });
      for (let ri = 0; ri < 6; ri++) {
        const val = team.roster[ri] ?? "";
        rosterInputs.appendChild(el("input", {
          type: "text",
          value: val,
          placeholder: "Player " + (ri + 1),
          oninput: (e) => {
            team.roster[ri] = e.target.value;
            // keep array length stable at 6 with falsy filtered on save
          },
        }));
      }
      const card = el("div", { class: "team-edit", style: { "--team-color": team.color } },
        el("div", { class: "team-edit-head" },
          el("input", {
            type: "color",
            value: team.color,
            oninput: (e) => {
              team.color = e.target.value;
              card.style.setProperty("--team-color", e.target.value);
            },
          }),
          el("input", {
            type: "text",
            value: team.name,
            placeholder: "Team name",
            oninput: (e) => team.name = e.target.value,
          }),
        ),
        rosterInputs,
      );
      teamsSec.appendChild(card);
    });
    body.appendChild(teamsSec);

    // Schedule
    const schedSec = el("div", { class: "ed-section" }, el("h3", {}, "Match Schedule"));
    const schedBody = el("div", {});
    const isAuto = DRAFT.matches == null;

    function colorForValue(value) {
      if (!value || value === "TBD") return "";
      const t = DRAFT.teams.find(x => x.name === value);
      return t ? t.color : "";
    }
    function applySlotStyle(wrap, value) {
      const color = colorForValue(value);
      wrap.classList.toggle("has-color", !!color);
      wrap.classList.toggle("empty", !value);
      wrap.classList.toggle("tbd", value === "TBD");
      wrap.style.setProperty("--slot-color", color || "");
    }
    function makeSlotSelect(currentValue, onChange) {
      const sel = el("select", {});
      const opts = [
        { value: "TBD", label: "TBD", color: "" },
        ...DRAFT.teams.map(t => ({ value: t.name, label: t.name, color: t.color })),
      ];
      for (const o of opts) {
        const opt = el("option", { value: o.value }, o.label);
        if (o.color) {
          // Browsers vary on supporting option styles; Chrome/Edge respect them.
          opt.style.color = o.color;
          opt.style.background = "#0b0f17";
          opt.style.fontWeight = "700";
        }
        if ((currentValue ?? "") === o.value) opt.selected = "selected";
        sel.appendChild(opt);
      }
      const swatch = el("span", { class: "slot-swatch" });
      const wrap = el("div", { class: "slot-wrap" }, swatch, sel);
      applySlotStyle(wrap, currentValue ?? "");
      sel.addEventListener("change", (e) => {
        applySlotStyle(wrap, e.target.value);
        onChange(e.target.value);
      });
      return wrap;
    }

    function drawSchedule() {
      schedBody.innerHTML = "";

      const currentMode = DRAFT.scheduleMode || "round-robin";
      const modePicker = el("div", { class: "mode-picker" });
      for (const m of SCHEDULE_MODES) {
        const isActive = currentMode === m;
        modePicker.appendChild(el("button", {
          class: "mode-btn" + (isActive ? " active" : ""),
          onclick: () => {
            DRAFT.scheduleMode = m;
            // Apply same transitions setScheduleMode does, but on DRAFT.
            if (m === "round-robin") {
              DRAFT.matches = null;
            } else if (m === "king") {
              const names = DRAFT.teams.map(t => t.name);
              const [a, b, c, d] = [names[0] ?? "TBD", names[1] ?? "TBD", names[2] ?? "TBD", names[3] ?? "TBD"];
              DRAFT.matches = [
                { round: 1, pairings: [
                  { teams: [a, b], winner: null },
                  { teams: [c, d], winner: null },
                ]},
                { round: 2, pairings: [
                  { teams: ["TBD","TBD"], winner: null },
                  { teams: ["TBD","TBD"], winner: null },
                ]},
                { round: 3, pairings: [
                  { teams: ["TBD","TBD"], winner: null },
                  { teams: ["TBD","TBD"], winner: null },
                ]},
              ];
            } else if (m === "manual") {
              if (!DRAFT.matches) {
                const seed = generateRoundRobin(DRAFT.teams);
                DRAFT.matches = seed.map(mm => ({
                  round: mm.round,
                  pairings: mm.pairings.map(p => ({ teams: [...p.teams], winner: null })),
                }));
              }
            }
            drawSchedule();
          },
        }, SCHEDULE_MODE_LABELS[m]));
      }
      schedBody.appendChild(modePicker);

      if (currentMode === "round-robin") {
        schedBody.appendChild(el("div", { class: "mode-explainer" },
          "Each team plays every other team once over 3 rounds. Pairings are auto-derived from the team list."));
        return;
      }
      if (currentMode === "king") {
        schedBody.appendChild(el("div", { class: "mode-explainer" },
          "Round 1: Team 1 vs Team 2 on Close Court, Team 3 vs Team 4 on Far Court. After each round, winners face each other on Close Court and losers face each other on Far Court."));
        return;
      }
      // manual — fall through to the editable schedule below

      function winnerEligible(value) {
        return value && value !== "TBD";
      }
      function makeWinBtn(pair, slotIdx) {
        const name = pair.teams[slotIdx];
        const eligible = winnerEligible(name);
        const color = colorForValue(name);
        const isActive = pair.winner === slotIdx;
        const btn = el("button", {
          class: "win-btn" + (isActive ? " active" : ""),
          style: { "--win-color": color || "var(--muted)" },
          title: eligible ? `Mark ${name} as winner` : "Pick a team first",
          ...(eligible ? {} : { disabled: "disabled" }),
          onclick: () => {
            pair.winner = isActive ? null : slotIdx;
            drawSchedule();
          },
        });
        btn.appendChild(el("span", { class: "swatch" }));
        btn.appendChild(el("span", {}, name || "—"));
        return btn;
      }

      DRAFT.matches.forEach((m, ri) => {
        const head = el("div", { class: "round-edit-head" },
          el("span", { class: "round-label" }, "Round " + (m.round ?? ri + 1)),
          el("button", {
            onclick: () => { DRAFT.matches.splice(ri, 1); renumberRounds(); drawSchedule(); },
          }, "Remove"),
        );

        const courtBlocks = [];
        DRAFT.courts.forEach((courtName, ci) => {
          // Ensure pairing exists in normalized form.
          m.pairings[ci] = normalizePairing(m.pairings[ci]);
          const pair = m.pairings[ci];
          const isCleared = pair.teams[0] === "TBD" && pair.teams[1] === "TBD" && pair.winner == null;

          const row = el("div", { class: "court-row" },
            el("div", { class: "court-label" }, courtName),
            makeSlotSelect(pair.teams[0], v => {
              pair.teams[0] = v;
              if (pair.winner === 0 && !winnerEligible(v)) pair.winner = null;
              drawSchedule();
            }),
            el("div", { class: "vs-lbl" }, "vs"),
            makeSlotSelect(pair.teams[1], v => {
              pair.teams[1] = v;
              if (pair.winner === 1 && !winnerEligible(v)) pair.winner = null;
              drawSchedule();
            }),
            el("button", {
              class: "clear-match",
              title: "Clear this match",
              ...(isCleared ? { disabled: "disabled" } : {}),
              onclick: () => {
                pair.teams[0] = "TBD"; pair.teams[1] = "TBD"; pair.winner = null;
                drawSchedule();
              },
            }, "×"),
          );
          courtBlocks.push(row);

          // Winner picker row — only useful when at least one slot has a real team.
          if (winnerEligible(pair.teams[0]) || winnerEligible(pair.teams[1])) {
            const winnerRow = el("div", { class: "winner-row" },
              el("span", { class: "winner-label" }, "Winner"),
              makeWinBtn(pair, 0),
              makeWinBtn(pair, 1),
              el("button", {
                class: "win-btn win-none",
                title: "Clear winner",
                ...(pair.winner == null ? { disabled: "disabled" } : {}),
                onclick: () => { pair.winner = null; drawSchedule(); },
              }, "—"),
            );
            courtBlocks.push(winnerRow);
          }
        });
        const roundBox = el("div", { class: "round-edit" }, head, ...courtBlocks);
        schedBody.appendChild(roundBox);
      });

      const actions = el("div", { class: "sched-actions" },
        el("button", {
          class: "add-round",
          onclick: () => {
            DRAFT.matches.push({
              round: DRAFT.matches.length + 1,
              pairings: DRAFT.courts.map(() => ({ teams: ["TBD", "TBD"], winner: null })),
            });
            drawSchedule();
          },
        }, "+ Add round"),
        el("button", {
          class: "btn ghost danger",
          onclick: () => {
            DRAFT.matches.forEach(m => {
              m.pairings = DRAFT.courts.map(() => ({ teams: ["TBD", "TBD"], winner: null }));
            });
            drawSchedule();
          },
        }, "Clear all matches"),
      );
      schedBody.appendChild(actions);
    }
    function isAutoNow() { return DRAFT.matches == null; }
    function renumberRounds() {
      DRAFT.matches.forEach((m, i) => m.round = i + 1);
    }

    drawSchedule();
    schedSec.appendChild(schedBody);
    body.appendChild(schedSec);

    // Rules
    const rulesList = el("div", { class: "rules-list" });
    function drawRules() {
      rulesList.innerHTML = "";
      DRAFT.rules.forEach((rule, i) => {
        rulesList.appendChild(el("div", { class: "rule-row" },
          el("input", {
            type: "text",
            value: rule,
            oninput: (e) => DRAFT.rules[i] = e.target.value,
          }),
          el("button", {
            onclick: () => { DRAFT.rules.splice(i, 1); drawRules(); },
            title: "Remove rule",
          }, "×"),
        ));
      });
    }
    drawRules();
    const rulesSec = el("div", { class: "ed-section" },
      el("h3", {}, "Rules"),
      rulesList,
      el("button", {
        class: "add-rule",
        onclick: () => { DRAFT.rules.push(""); drawRules(); },
      }, "+ Add rule"),
    );
    body.appendChild(rulesSec);

    // Import / Export
    const ioStatus = el("div", { class: "io-status" });
    function setStatus(msg, kind) {
      pendingIoStatus = msg ? { msg, kind } : null;
      ioStatus.textContent = msg || "";
      ioStatus.className = "io-status" + (kind ? " " + kind : "");
    }
    // Restore any status from a previous render (e.g. after Load redraws the editor).
    if (pendingIoStatus) {
      ioStatus.textContent = pendingIoStatus.msg;
      ioStatus.className = "io-status " + (pendingIoStatus.kind || "");
    }
    const ioTextarea = el("textarea", {
      spellcheck: "false",
      autocomplete: "off",
      autocapitalize: "off",
      autocorrect: "off",
    });
    function refreshIoTextarea() {
      ioTextarea.value = JSON.stringify(DRAFT, null, 2);
    }
    refreshIoTextarea();

    const copyBtn = el("button", {
      class: "btn ghost",
      onclick: async () => {
        refreshIoTextarea();
        try {
          await navigator.clipboard.writeText(ioTextarea.value);
          setStatus("Copied current draft to clipboard.", "ok");
        } catch (err) {
          ioTextarea.focus();
          ioTextarea.select();
          setStatus("Copy blocked — text is selected; press Ctrl+C.", "err");
        }
      },
    }, "Copy to clipboard");

    const loadBtn = el("button", {
      class: "btn ghost",
      onclick: () => {
        let parsed;
        try {
          parsed = JSON.parse(ioTextarea.value);
        } catch (err) {
          setStatus("Parse error: " + err.message, "err");
          return;
        }
        if (!parsed || typeof parsed !== "object") {
          setStatus("Expected a JSON object.", "err"); return;
        }
        if (!Array.isArray(parsed.teams) || parsed.teams.length === 0) {
          setStatus("Missing or empty 'teams' array.", "err"); return;
        }
        if (!Array.isArray(parsed.courts) || parsed.courts.length === 0) {
          setStatus("Missing or empty 'courts' array.", "err"); return;
        }
        // Sanitize: ensure each team has name, color, roster.
        parsed.teams = parsed.teams.map((t, i) => ({
          name: String(t?.name ?? "Team " + (i + 1)),
          color: String(t?.color ?? "#888888"),
          roster: Array.isArray(t?.roster) ? t.roster.map(n => String(n ?? "")) : [],
        }));
        parsed.courts = parsed.courts.map(c => String(c ?? ""));
        parsed.rules = Array.isArray(parsed.rules) ? parsed.rules.map(r => String(r ?? "")) : [];
        parsed.sessionTitle = String(parsed.sessionTitle ?? "Open Gym");
        parsed.date = String(parsed.date ?? "");
        parsed.subtitle = String(parsed.subtitle ?? "");
        normalizeConfig(parsed);
        DRAFT = parsed;
        setStatus("Loaded into draft — review and Save to apply.", "ok");
        renderEditor();
      },
    }, "Load from textarea");

    const refreshBtn = el("button", {
      class: "btn ghost",
      onclick: () => {
        refreshIoTextarea();
        setStatus("Refreshed textarea from current draft.", "ok");
      },
    }, "Refresh");

    const ioSec = el("div", { class: "ed-section io-section" },
      el("h3", {}, "Import / Export"),
      el("div", { class: "io-hint" },
        "JSON of the current draft. Edit here and Load to replace, or Copy to share."),
      ioTextarea,
      el("div", { class: "io-actions" }, copyBtn, loadBtn, refreshBtn),
      ioStatus,
    );
    body.appendChild(ioSec);
  }

  function commitSave() {
    // Trim empty trailing roster slots are fine — UI pads to 6. Just clean nulls.
    DRAFT.teams.forEach(t => {
      t.roster = t.roster.map(n => (n ?? "").trim());
    });
    DRAFT.rules = DRAFT.rules.map(r => r.trim()).filter(Boolean);
    DRAFT.courts = DRAFT.courts.map(c => c.trim() || "Court");
    CONFIG = structuredClone(DRAFT);
    // If we left manual mode, leave any in-progress lineup editing too.
    if (getScheduleMode() !== "manual") mainEditMode = false;
    saveConfig(CONFIG);
    closeEditor();
    render();
  }

  function commitReset() {
    if (!confirm("Reset to the defaults baked into the HTML file?")) return;
    clearConfig();
    CONFIG = loadConfig();
    closeEditor();
    render();
  }

  // ============ WIRE UP ============
  $("#editBtn").addEventListener("click", openEditor);
  $("#closeEditor").addEventListener("click", closeEditor);
  $("#cancelBtn").addEventListener("click", closeEditor);
  $("#editorOverlay").addEventListener("click", closeEditor);
  $("#saveBtn").addEventListener("click", commitSave);
  $("#resetBtn").addEventListener("click", commitReset);
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && $("#editor").classList.contains("open")) closeEditor();
  });

  render();
</script>
</body>
</html>
