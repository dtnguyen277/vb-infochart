<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Volleyball Open Gym</title>

<!-- =====================================================================
     DEFAULT SESSION CONFIG — you can also edit live via the Edit button.
     Live edits are saved to your browser (localStorage); use "Reset to
     file defaults" in the editor to clear them.
     ===================================================================== -->
<script>
const DEFAULT_CONFIG = {
  sessionTitle: "Sunday Open Gym",
  date: "May 25, 2026",
  subtitle: "",                  // optional: "7:00 - 9:00 PM" etc.

  // Schedule mode:
  //   "round-robin" — each team plays each other once (n-1 rounds); can be
  //                   extended past that with + on the board, looping pairings
  //   "king"        — Round 1 fixed; later rounds = winners on Court 1, losers on Court 2
  //   "manual"      — pairings fully under user control
  scheduleMode: "round-robin",

  // Phased rosters: when true, each schedule round can have different players
  // (team names/colors stay shared). Off = single shared roster (legacy).
  differentTeamsPerRound: false,

  courts: ["Close Court", "Far Court"],

  teams: [
    { name: "Red",    color: "#ef4444", roster: ["Alice","Ben","Chris","Dana","Eli","Evan"] },
    { name: "Blue",   color: "#3b82f6", roster: ["Frank","Grace","Henry","Ivy","Jay","Jess"] },
    { name: "Green",  color: "#22c55e", roster: ["Kara","Leo","Maya","Noah","Owen","Olivia"] },
    { name: "Yellow", color: "#eab308", roster: ["Pat","Quinn","Riley","Sam","Tara","Tom"] },
  ],

  // Leave matches: null to auto-generate round-robin from the 4 teams above.
  matches: null,

  rules: [
    "Sets to 21, cap 23",
    "King of the court",
    "3 min rest between sets",
  ],
};
</script>
<!-- ===================================================================== -->

<style>
  :root {
    --bg: #0b0f17;
    --panel: #121826;
    --panel-2: #182033;
    --border: #243049;
    --text: #f1f5f9;
    --muted: #7b8aa8;
    --accent: #e2e8f0;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", system-ui, sans-serif;
    overflow: hidden;
  }

  .stage {
    height: 100vh;
    width: 100vw;
    display: grid;
    grid-template-rows: 8vh auto 1fr;
    gap: 1.2vh;
    padding: 1.2vh 1.4vw;
  }

  /* ---------- HEADER ---------- */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 1.2vw;
    border-bottom: 1px solid var(--border);
  }
  .header .title-block { display: flex; flex-direction: column; gap: 0.4vh; }
  .header .title { font-size: 4vh; font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
  .header .subtitle {
    font-size: 1.6vh; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.18em;
  }
  .header .date-block {
    display: flex; flex-direction: column; align-items: flex-end; gap: 0.2vh;
    border-left: 2px solid var(--border);
    padding-left: 1.4vw;
  }
  .header .weekday {
    font-size: 1.6vh; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.22em;
    line-height: 1;
  }
  .header .date {
    font-size: 2.6vh; font-weight: 800; letter-spacing: -0.01em;
    color: var(--text); line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- TEAMS ROW ---------- */
  .teams {
    display: grid;
    grid-template-columns: repeat(var(--team-cols, 4), 1fr);
    gap: 1.2vw;
  }
  .team {
    --tint-strong: color-mix(in srgb, var(--team-color, var(--accent)) 22%, var(--panel));
    --tint-soft:   color-mix(in srgb, var(--team-color, var(--accent)) 10%, var(--panel));
    background: linear-gradient(180deg, var(--tint-strong) 0%, var(--tint-soft) 100%);
    border: 1px solid color-mix(in srgb, var(--team-color, var(--accent)) 45%, var(--border));
    border-radius: 1.4vh;
    padding: 0 1.6vw 1.8vh;
    display: flex; flex-direction: column;
    min-width: 0;
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 0 0 var(--team-color);
  }
  .team-header {
    background: var(--team-color, var(--accent));
    margin: 0 -1.6vw 1.6vh;
    padding: 1.6vh 1.6vw;
    display: flex; align-items: center; justify-content: space-between;
    gap: 0.8vw;
  }
  .team-name {
    font-size: 3vh; font-weight: 900; letter-spacing: 0.02em;
    text-transform: uppercase;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.25);
  }
  .team-wins {
    display: inline-flex; align-items: baseline; gap: 0.3vw;
    background: rgba(0, 0, 0, 0.32);
    color: #fff;
    padding: 0.5vh 0.9vw;
    border-radius: 0.6vh;
    font-variant-numeric: tabular-nums;
  }
  .team-wins .wins-num {
    font-size: 2.4vh; font-weight: 800;
    line-height: 1;
  }
  .team-wins .wins-label {
    font-size: 2vh;
    line-height: 1;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,0.4));
  }
  .roster {
    display: flex; flex-direction: column;
    gap: 0.6vh;
    list-style: none; padding: 0; margin: 0;
  }
  .roster li {
    font-size: 2.2vh;
    font-weight: 600;
    padding: 0.5vh 0;
    border-bottom: 1px dashed color-mix(in srgb, var(--team-color, var(--accent)) 35%, transparent);
    color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .roster li:last-child { border-bottom: none; }
  .roster li.empty { color: var(--muted); font-style: italic; font-weight: 400; }
  .roster li { display: flex; align-items: center; gap: 0.8vw; }
  .pos-badge {
    flex: none;
    min-width: 3.2ch;
    text-align: center;
    font-size: 1.2vh;
    font-weight: 800;
    letter-spacing: 0.02em;
    color: #fff;
    background: color-mix(in srgb, var(--team-color, var(--accent)) 55%, transparent);
    border: 1px solid color-mix(in srgb, var(--team-color, var(--accent)) 70%, transparent);
    border-radius: 0.6vh;
    padding: 0.2vh 0.4vw;
  }
  .player-name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pos-badge.sub {
    background: color-mix(in srgb, var(--muted) 40%, transparent);
    border-color: color-mix(in srgb, var(--muted) 55%, transparent);
    color: var(--text);
  }

  /* Swap affordances on the main board. */
  .roster li.slot { cursor: pointer; border-radius: 0.6vh; transition: background 0.12s, box-shadow 0.12s; }
  .roster li.slot:hover { background: color-mix(in srgb, var(--team-color, var(--accent)) 14%, transparent); }
  .roster li.slot:active { cursor: grabbing; }
  .roster li.selected {
    background: color-mix(in srgb, var(--team-color, var(--accent)) 26%, transparent);
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--team-color, var(--accent)) 70%, transparent);
  }
  .roster li.drag-over {
    background: color-mix(in srgb, var(--team-color, var(--accent)) 22%, transparent);
    box-shadow: inset 0 0 0 1px var(--team-color, var(--accent));
  }

  /* When any team has subs, tighten every roster so 8 rows still fit. */
  .teams.dense .roster { gap: 0.35vh; }
  .teams.dense .roster li { font-size: 1.85vh; padding: 0.3vh 0; }
  .teams.dense .pos-badge { font-size: 1.05vh; }

  /* ---------- BOTTOM ROW: SCHEDULE + RULES ---------- */
  .bottom {
    display: grid;
    grid-template-columns: 1fr 3.2fr;
    gap: 1.2vw;
    min-height: 0;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 1.4vh;
    padding: 2vh 1.6vw;
    display: flex; flex-direction: column;
    min-width: 0; min-height: 0;
  }
  .panel-title {
    font-size: 2.2vh; font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 1.6vh;
  }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 0.8vw;
    margin-bottom: 1.6vh;
  }
  .panel-head .panel-title { margin-bottom: 0; }
  .panel-actions { display: flex; align-items: center; gap: 0.8vw; }
  .edit-lineups-btn {
    background: transparent; color: var(--muted);
    border: 1px solid var(--border); border-radius: 0.6vh;
    padding: 0.5vh 0.9vw;
    font-size: 1.4vh; font-weight: 700;
    cursor: pointer; font-family: inherit;
    text-transform: uppercase; letter-spacing: 0.1em;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .edit-lineups-btn:hover:not(:disabled) { color: var(--text); border-color: var(--text); }
  .edit-lineups-btn.active {
    background: var(--accent); color: #0b0f17; border-color: var(--accent);
  }
  .edit-lineups-btn:disabled, .edit-lineups-btn.disabled {
    opacity: 0.4; cursor: not-allowed;
  }

  /* ---------- SCHEDULE ---------- */
  .schedule {
    flex: 1;
    display: grid;
    grid-template-columns: auto repeat(var(--court-count, 2), 1fr);
    gap: 0.4vh 1.2vw;
    align-content: start;
  }
  .sched-cell {
    display: flex; align-items: center;
    padding: 1.1vh 0.4vw;
    font-size: 2.4vh;
    border-bottom: 1px solid var(--border);
  }
  .sched-head {
    font-size: 1.6vh; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.1em;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0.8vh;
  }
  .sched-round {
    font-weight: 800; font-size: 2.6vh;
    color: var(--muted);
    justify-content: center;
    min-width: 4vw;
  }
  .match { display: flex; align-items: center; gap: 0.8vw; font-weight: 700; }
  .match .vs {
    color: var(--muted); font-weight: 500; font-size: 1.8vh;
    text-transform: uppercase; letter-spacing: 0.12em;
  }
  .match .vs.clickable {
    cursor: pointer;
    border: 1px dashed transparent;
    border-radius: 0.6vh;
    padding: 0.2vh 0.6vw;
    transition: color 0.12s, border-color 0.12s;
  }
  .match .vs.clickable:hover { color: var(--text); border-color: var(--border); }

  /* Final score sits where the "vs" would be — winner's number stands out. */
  .match .score-box {
    display: inline-flex; align-items: baseline;
    gap: 0.4vw;
    padding: 0.2vh 0.8vw;
    border-radius: 0.7vh;
    background: var(--panel-2);
    border: 1px solid var(--border);
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .match .score-box.clickable { cursor: pointer; transition: border-color 0.12s, background 0.12s; }
  .match .score-box.clickable:hover { border-color: var(--text); background: var(--panel); }
  .match .score-num {
    font-size: 2.6vh; font-weight: 800;
    color: var(--muted);
  }
  .match .score-num.win { color: var(--text); }
  .match .score-dash { font-size: 1.8vh; font-weight: 700; color: var(--muted); }

  /* Vertical divider separating courts in the schedule grid. */
  .schedule .court-divide {
    border-left: 2px solid color-mix(in srgb, var(--text) 16%, var(--border));
    margin-left: -0.6vw;
    padding-left: 0.6vw;
  }
  .match .team-chip {
    display: inline-flex; align-items: center; gap: 0.5vw;
    padding: 0.3vh 0.7vw;
    border-radius: 0.6vh;
    background: color-mix(in srgb, var(--team-color, var(--accent)) 18%, transparent);
    border: 1px solid color-mix(in srgb, var(--team-color, var(--accent)) 50%, transparent);
    position: relative;
    cursor: pointer;
    transition: filter 0.12s, transform 0.08s, background 0.12s;
    user-select: none;
  }
  .match .team-chip:hover {
    filter: brightness(1.18);
    background: color-mix(in srgb, var(--team-color, var(--accent)) 28%, transparent);
  }
  .match .team-chip:active { transform: scale(0.97); }
  .match .team-chip .team-dot {
    width: 1.2vh; height: 1.2vh;
    background: var(--team-color, var(--accent));
    border-radius: 50%;
  }
  .match .team-chip.winner {
    background: color-mix(in srgb, var(--team-color, var(--accent)) 32%, transparent);
    border-color: color-mix(in srgb, var(--team-color, var(--accent)) 80%, transparent);
    box-shadow: 0 0 0 0.2vh color-mix(in srgb, var(--team-color, var(--accent)) 28%, transparent);
  }
  .match .winner-slot {
    display: inline-flex;
    align-items: center;
    gap: 0.5vw;
  }
  .match .winner-slot .trophy {
    font-size: 2vh; line-height: 1;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,0.4));
  }
  .match .tbd-chip {
    display: inline-flex; align-items: center;
    padding: 0.3vh 0.9vw;
    border-radius: 0.6vh;
    background: transparent;
    border: 1px dashed var(--border);
    color: var(--muted);
    font-weight: 700;
    font-size: 1.8vh;
    letter-spacing: 0.12em;
  }
  .match .blank {
    color: var(--border);
    font-weight: 700;
    font-size: 2.4vh;
    padding: 0 0.4vw;
  }
  .sched-cell.match-blank {
    grid-column: span 1;
    justify-content: center;
    color: var(--border);
    font-style: italic;
    font-size: 2vh;
  }
  .add-round-main {
    grid-column: 1;
    justify-self: center;
    margin-top: 0.8vh;
    width: 3.2vh; height: 3.2vh;
    border-radius: 50%;
    background: transparent;
    color: var(--muted);
    border: 1px dashed var(--border);
    cursor: pointer;
    font: inherit;
    font-size: 2.2vh; font-weight: 700; line-height: 1;
    padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    transition: color 0.15s, border-color 0.15s, background 0.15s;
  }
  .add-round-main:hover {
    color: var(--text);
    border-color: var(--text);
    background: rgba(255,255,255,0.05);
  }
  .match .blank.clickable, .match .tbd-chip.clickable {
    cursor: pointer;
    transition: color 0.12s, border-color 0.12s, background 0.12s;
  }
  .match .blank.clickable {
    border: 1px dashed var(--border);
    border-radius: 0.6vh;
    padding: 0.3vh 0.9vw;
    color: var(--muted);
    font-size: 2vh; font-weight: 700;
  }
  .match .blank.clickable:hover { color: var(--text); border-color: var(--text); }
  .match .tbd-chip.clickable:hover {
    color: var(--text); border-color: var(--text);
  }
  .match .clear-match-btn {
    margin-left: 0.6vw;
    width: 2.4vh; height: 2.4vh;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 0.4vh;
    cursor: pointer;
    font: inherit;
    font-size: 1.6vh; line-height: 1;
    padding: 0;
  }
  .match .clear-match-btn:hover {
    color: #f87171; border-color: #7f1d1d;
  }

  /* ---------- TEAM PICKER POPOVER ---------- */
  .team-picker {
    position: fixed;
    z-index: 50;
    background: #182033;
    border: 1px solid var(--border);
    border-radius: 0.8vh;
    padding: 4px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.55);
    min-width: 160px;
    font-size: 14px;
    font-family: inherit;
  }
  .team-picker-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px;
    cursor: pointer;
    border-radius: 6px;
    color: var(--text);
    user-select: none;
  }
  .team-picker-item:hover { background: rgba(255, 255, 255, 0.08); }
  .team-picker-item.selected { background: rgba(255, 255, 255, 0.05); }
  .team-picker-item .picker-dot {
    width: 11px; height: 11px; border-radius: 50%;
    background: var(--picker-color, transparent);
    border: 1px solid color-mix(in srgb, var(--picker-color, var(--border)) 60%, var(--border));
    flex-shrink: 0;
  }
  .team-picker-item:not(.has-color) .picker-dot {
    background: transparent; border-style: dashed;
  }
  .team-picker-item.tbd-row .picker-dot {
    background: repeating-linear-gradient(45deg, var(--muted) 0 2px, transparent 2px 4px);
    border-color: var(--muted);
  }

  /* ---------- SCORE PICKER POPOVER ---------- */
  .score-picker { padding: 12px; min-width: 220px; }
  .score-picker-title {
    font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .score-picker-row {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 8px;
  }
  .score-picker-row .picker-dot {
    width: 11px; height: 11px; border-radius: 50%;
    background: var(--picker-color, var(--accent));
    border: 1px solid color-mix(in srgb, var(--picker-color, var(--border)) 60%, var(--border));
    flex-shrink: 0;
  }
  .score-picker-name {
    flex: 1; min-width: 0;
    font-weight: 700; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .score-input {
    width: 56px; flex-shrink: 0;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 8px; font: inherit; font-weight: 700;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .score-picker-actions {
    display: flex; gap: 6px; justify-content: flex-end;
    margin-top: 4px;
  }
  .score-picker-actions .btn { padding: 6px 12px; font-size: 12px; }

  /* ---------- RULES ---------- */
  .rules {
    flex: 1;
    list-style: none; padding: 0; margin: 0;
    display: flex; flex-direction: column;
    gap: 1.2vh;
  }
  .rules li {
    font-size: 2.2vh;
    line-height: 1.35;
    padding-left: 1.6vw;
    position: relative;
  }
  .rules li::before {
    content: "";
    position: absolute;
    left: 0; top: 1.1vh;
    width: 0.7vh; height: 0.7vh;
    background: var(--accent);
    border-radius: 50%;
  }

  /* ---------- EDITOR ---------- */
  .edit-btn {
    position: fixed;
    bottom: 1.6vh; right: 1.6vh;
    z-index: 10;
    width: 4.2vh; height: 4.2vh;
    display: inline-flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.12);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 50%;
    cursor: pointer;
    opacity: 0.6;
    transition: opacity 0.2s, color 0.2s, background 0.2s, transform 0.2s;
    font-family: inherit;
    padding: 0;
  }
  .edit-btn:hover {
    opacity: 1;
    color: var(--text);
    background: rgba(255,255,255,0.2);
    transform: scale(1.05);
  }
  .edit-btn svg { width: 2vh; height: 2vh; display: block; }

  .teams-block { display: flex; flex-direction: column; gap: 1vh; min-height: 0; }
  .round-tabs { display: flex; flex-wrap: wrap; gap: 0.6vw; align-items: center; }
  .round-tab {
    background: var(--panel-2); color: var(--muted);
    border: 1px solid var(--border); border-radius: 0.6vh;
    padding: 0.5vh 1vw; font-size: 1.7vh; font-weight: 600;
    cursor: pointer; transition: background 0.12s, color 0.12s, border-color 0.12s;
  }
  .round-tab:hover { color: var(--text); border-color: var(--text); }
  .round-tab.active { background: var(--accent); color: #0b0f17; border-color: var(--accent); }
  .round-tab.reset { margin-left: auto; }
  .ed-toggle { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 13px; }
  .ed-toggle input { width: auto; }
  .ed-toggle-hint { color: var(--muted); font-style: italic; }
  .shuffle-fab {
    position: fixed;
    bottom: 1.6vh; left: 1.6vh;
    z-index: 10;
    display: flex; gap: 0.8vh;
    opacity: 0.6;
    transition: opacity 0.2s;
  }
  .shuffle-fab:hover { opacity: 1; }
  .shuffle-fab button {
    display: inline-flex; align-items: center; gap: 0.5vh;
    background: rgba(255,255,255,0.12);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.8vh 1.6vh;
    font-family: inherit; font-size: 1.6vh; font-weight: 700;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }
  .shuffle-fab button:hover { background: rgba(255,255,255,0.2); }
  .shuffle-fab button:active { transform: scale(0.95); }
  .shuffle-fab .undo-btn { display: none; }
  .shuffle-fab .undo-btn.show { display: inline-flex; }

  @keyframes just-shuffled-flash {
    0%   { opacity: 0.35; transform: translateY(0.6vh); }
    100% { opacity: 1; transform: translateY(0); }
  }
  .teams.just-shuffled .roster { animation: just-shuffled-flash 0.35s ease-out; }

  .editor-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 20;
    display: none;
  }
  .editor-overlay.open { display: block; }

  .editor {
    position: fixed;
    top: 0; right: 0;
    width: min(560px, 100vw);
    height: 100vh;
    height: 100dvh; /* mobile-safe — accounts for URL bar */
    background: var(--panel);
    border-left: 1px solid var(--border);
    z-index: 21;

  /* When the editor is open, lock background scrolling. */

  .editor-foot {

  .ed-section {

  .ed-section > summary {
    list-style: none;

    transition: color 0.15s, background 0.15s;
  }
  .ed-section > summary::-webkit-details-marker { display: none; }
  .ed-section > summary::after {
    content: "";
    width: 8px; height: 8px;
    border-right: 1.5px solid currentColor;
    border-bottom: 1.5px solid currentColor;
    transform: rotate(-45deg);
    transition: transform 0.15s;
    flex-shrink: 0;
    margin-right: 2px;
  }
  .ed-section[open] > summary {
    color: var(--text);
    border-bottom: 1px solid var(--border);
  }
  .ed-section[open] > summary::after {
    transform: rotate(45deg);
  }
  .ed-section > summary:hover { color: var(--text); }
  .ed-section > *:not(summary) {
    padding-left: 14px;
    padding-right: 14px;
  }
  .ed-section > *:nth-child(2) { padding-top: 14px; }
  .ed-section > *:last-child:not(summary) { padding-bottom: 14px; }
  .ed-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
  .ed-row label { width: 80px; font-size: 12px; color: var(--muted); }
  .ed-row input[type="text"], .ed-row input[type="color"] {
    flex: 1; min-width: 0;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 10px;

  .ed-row input[type="color"] {

  .date-row { display: flex; gap: 8px; flex: 1; min-width: 0; align-items: center; }
  .today-btn {
    flex: none;
    background: transparent; color: var(--muted);

  .team-edit {
    background: var(--bg);

  .color-swatches { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }

  .roster-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

  .roster-pos-row { display: flex; align-items: center; gap: 8px; }

  .rules-list { display: flex; flex-direction: column; gap: 6px; }

  .rule-row input {

  .rule-row button, .add-rule, .add-round {

  .rule-row button:hover, .add-rule:hover, .add-round:hover {

  .team-tools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

  /* Schedule editor */

  .round-edit {

  .round-edit-head {

  .winner-row .win-btn.active {

  .winner-row .win-btn .swatch {

  .winner-row .win-none { opacity: 0.8; }
  .court-row:last-child { margin-bottom: 0; }
  .court-row .court-label {
    font-size: 11px; font-weight: 600;

  .slot-wrap {
    position: relative;
    display: flex; align-items: center;

  .slot-swatch {
    width: 10px; height: 10px; border-radius: 50%;

  /* Import / Export */
  .io-section textarea {

  @media print { .edit-btn, .shuffle-fab, .editor-overlay, .editor { display: none !important; } }

  /* ---------- MOBILE ---------- */
  /* On phones / narrow screens, drop the fixed-viewport TV layout and let the
     page scroll. Stack teams 2x2 and stack schedule above rules. */
  @media (max-width: 900px) {
    html, body { overflow: auto; height: auto; }
    body { -webkit-text-size-adjust: 100%; }

    .stage {
      height: auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 14px;

      gap: 12px;
    }

    .header .weekday { font-size: 10px; }
    .header .date { font-size: 15px; }

    .teams {
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .team { border-radius: 10px; padding: 0 12px 12px; }
    .team-header { margin: 0 -12px 10px; padding: 10px 12px; }
    .team-name { font-size: 15px; }
    .team-wins { padding: 4px 8px; border-radius: 6px; }
    .team-wins .wins-num { font-size: 15px; }
    .team-wins .wins-label { font-size: 14px; }
    .roster li { font-size: 13px; padding: 4px 0; }
    .roster li { gap: 8px; }
    .pos-badge { font-size: 10px; min-width: 3.2ch; padding: 1px 4px; border-radius: 4px; }

    .bottom { grid-template-columns: 1fr; gap: 10px; }
    .panel { border-radius: 10px; padding: 14px; }
    .panel-head { margin-bottom: 10px; }
    .panel-title { font-size: 12px; }

    /* Schedule becomes a single column of round groups; each match is its own
       full-width card labeled with its court, so two courts no longer fight
       for a cramped half-width column. */
    .schedule {
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    /* The desktop column headers (Round / court names) are redundant here —
       round numbers become section headers and each card self-labels. */
    .schedule > .sched-head { display: none; }

    .schedule .sched-round {
      display: flex; align-items: center; gap: 10px;
      justify-content: flex-start;
      min-width: 0;
      border-bottom: none;
      padding: 0;
      margin: 18px 0 10px;
      font-size: 12px; font-weight: 800;
      letter-spacing: 0.16em;
      color: var(--muted);
    }
    .schedule .sched-round:first-of-type { margin-top: 0; }
    .schedule .sched-round::after {
      content: "";
      flex: 1; height: 1px;
      background: var(--border);
    }

    /* Each match: court label on top, the two teams balanced around the
       center "vs"/score beneath. */
    .sched-cell.match,
    .sched-cell.match-blank {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      column-gap: 8px;
      row-gap: 9px;
      padding: 11px 12px;
      margin-bottom: 8px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel-2);
      font-size: 14px;
    }
    .sched-cell.match::before,
    .sched-cell.match-blank::before {
      content: attr(data-court);
      grid-column: 1 / -1;
      font-size: 9px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.16em;
      color: var(--muted);

    .sched-cell.match-blank {
      justify-items: center;
      color: var(--border);
      font-style: italic;

    /* Team A hugs the center from the left, Team B from the right. */
    .sched-cell.match > :nth-child(1) { justify-self: end; }

    .sched-cell.match > :nth-child(3) { justify-self: start; }

    .match .team-chip { font-size: 14px; padding: 6px 10px; gap: 7px; border-radius: 7px; }

    .match .winner-slot { gap: 6px; }
    .match .winner-slot .trophy { font-size: 14px; }
    .match .vs { font-size: 10px; letter-spacing: 0.16em; }

    .match .score-box { padding: 3px 9px; border-radius: 7px; gap: 5px; }
    .match .score-num { font-size: 16px; }
    .match .score-dash { font-size: 12px; }
    .match .trophy { font-size: 13px; }
    .match .tbd-chip { font-size: 12px; padding: 6px 10px; }
    .match .blank { font-size: 15px; }
    .match .blank.clickable { font-size: 14px; padding: 5px 10px; border-radius: 6px; }
    /* When editing, the clear (×) button drops to its own line, right-aligned. */
    .match .clear-match-btn {
      grid-column: 1 / -1;

    .edit-btn {

    }

    .edit-lineups-btn { font-size: 10px; padding: 5px 8px; }
    .add-round-main { width: 32px; height: 32px; font-size: 20px; margin-top: 8px; }

    .editor { width: 100vw; }
  }
</style>

<body>

<div class="stage" id="stage"></div>

<div class="shuffle-fab">
  <button id="shufflePosBtn" title="Shuffle players within each position (live)">🎲 Positions</button>
  <button id="shuffleAllBtn" title="Shuffle everyone across all teams (live)">🎲 Everyone</button>
  <button id="shuffleUndoBtn" class="undo-btn" title="Undo the last change (shuffle or swap)">↩ Undo</button>
</div>
<button class="edit-btn" id="editBtn" title="Edit session" aria-label="Edit session">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 20h9"/>
    <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
  </svg>
</button>

<div class="editor-overlay" id="editorOverlay"></div>
<aside class="editor" id="editor">
  <div class="editor-head">
    <h2>Edit Session</h2>
    <button id="closeEditor" title="Close">×</button>
  </div>
  <div class="editor-body" id="editorBody"></div>
  <div class="editor-foot">
    <div class="left">
      <button class="btn danger" id="resetBtn">Reset to file defaults</button>
    </div>
    <div class="right">
      <button class="btn secondary" id="cancelBtn">Cancel</button>
      <button class="btn" id="saveBtn">Save</button>
    </div>
  </div>
</aside>

<script>
  // ============ STATE ============
  const POSITIONS = ["S", "OH1", "M", "OPP", "OH2", "L"];
  const CORE_SLOTS = 6;          // fixed positions
  const MAX_SUBS = 2;            // extra bench slots
  const SLOT_COUNT = CORE_SLOTS + MAX_SUBS; // 8
  // Label for a roster row: fixed position, or "SUB" for bench slots.
  function posLabel(i) { return POSITIONS[i] ?? "SUB"; }
  const COLOR_PRESETS = ["#ef4444", "#f97316", "#eab308", "#22c55e", "#14b8a6", "#3b82f6", "#8b5cf6", "#ec4899"];
  const STORAGE_KEY = "vb-opengym-config";

  // Coerce a value to a finite number, or null. Allows 0; rejects "" / junk.
  function numOrNull(v) {
    if (v === "" || v == null) return null;
    const n = Number(v);
    return Number.isFinite(n) ? n : null;
  }
  // Normalize a final-score pair to [a, b] (numbers/null) or null when empty.
  function normalizeScores(s) {
    if (!Array.isArray(s)) return null;
    const a = numOrNull(s[0]);
    const b = numOrNull(s[1]);
    return (a == null && b == null) ? null : [a, b];
  }

  // Normalize a pairing to { teams: [a, b], winner: null | 0 | 1, scores }.
  // Accepts legacy array shape [a, b]. Empty slots are migrated to "TBD".
  function normalizePairing(p) {
    const slot = v => (!v ? "TBD" : v);
    if (!p) return { teams: ["TBD", "TBD"], winner: null, scores: null };
    if (Array.isArray(p)) return { teams: [slot(p[0]), slot(p[1])], winner: null, scores: null };
    const teams = [slot(p.teams?.[0]), slot(p.teams?.[1])];
    const w = (p.winner === 0 || p.winner === 1) ? p.winner : null;
    const valid = w !== null && teams[w] && teams[w] !== "TBD";
    return { teams, winner: valid ? w : null, scores: normalizeScores(p.scores) };
  }
  function normalizeMatches(matches) {
    if (matches == null) return null;
    return matches.map((m, i) => ({
      round: m.round ?? i + 1,
      pairings: (m.pairings || []).map(normalizePairing),
    }));
  }
  function normalizeConfig(cfg) {
    cfg.matches = normalizeMatches(cfg.matches);
    // Phased rosters: coerce the flag; drop a malformed store, and sanitize a
    // valid one into an array-of-rounds of array-of-teams of string rosters
    // (guards against hand-edited/imported JSON). syncRoundRosters fixes dims.
    cfg.differentTeamsPerRound = !!cfg.differentTeamsPerRound;
    if (!Array.isArray(cfg.roundRosters)) {
      cfg.roundRosters = undefined;
    } else {
      cfg.roundRosters = cfg.roundRosters.map(round =>
        Array.isArray(round)
          ? round.map(roster => Array.isArray(roster) ? roster.map(n => String(n ?? "")) : [])
          : []);
    }
    // Optional round-robin round count (used to loop past a single cycle).
    const rr = Math.floor(Number(cfg.roundRobinRounds));
    cfg.roundRobinRounds = Number.isFinite(rr) && rr > 0 ? rr : undefined;
    // Backward-compat: if scheduleMode missing, infer from matches.
    if (cfg.scheduleMode !== "round-robin" && cfg.scheduleMode !== "king" && cfg.scheduleMode !== "manual") {
      cfg.scheduleMode = cfg.matches == null ? "round-robin" : "manual";
    }
    return cfg;
  }

  const SCHEDULE_MODES = ["round-robin", "king", "manual"];
  const SCHEDULE_MODE_LABELS = {
    "round-robin": "Round robin",
    "king":        "King of the court",
    "manual":      "Manual",
  };
  function getScheduleMode() {
    return SCHEDULE_MODES.includes(CONFIG.scheduleMode)
      ? CONFIG.scheduleMode
      : "round-robin";
  }

  // Build an explicit matches array from the current round-robin schedule.
  function materializeFromRoundRobin() {
    return generateRoundRobin(CONFIG.teams, CONFIG.roundRobinRounds).map(m => ({
      round: m.round,
      pairings: m.pairings.map(p => ({ teams: [...p.teams], winner: null })),
    }));
  }

  // Initial King of the Court schedule: 3 rounds, Round 1 = T1 vs T2 / T3 vs T4,
  // Rounds 2+ filled with TBD until prior winners are set.
  function buildKingInitial(numRounds = 3) {
    const names = CONFIG.teams.map(t => t.name);
    const [a, b, c, d] = [names[0] ?? "TBD", names[1] ?? "TBD", names[2] ?? "TBD", names[3] ?? "TBD"];
    const out = [{
      round: 1,
      pairings: [
        { teams: [a, b], winner: null },
        { teams: [c, d], winner: null },
      ],
    }];
    for (let r = 2; r <= numRounds; r++) {
      out.push({
        round: r,
        pairings: [
          { teams: ["TBD", "TBD"], winner: null },
          { teams: ["TBD", "TBD"], winner: null },
        ],
      });
    }
    return out;
  }

  // Walk through king-of-the-court rounds and rewrite each later round's
  // pairings based on the previous round's winners/losers. If a later round's
  // expected teams change, its winner is cleared.
  function recomputeKingDownstream() {
    if (getScheduleMode() !== "king" || !CONFIG.matches) return;
    for (let i = 0; i < CONFIG.matches.length - 1; i++) {
      const curr = CONFIG.matches[i];
      const next = CONFIG.matches[i + 1];
      const [p0, p1] = curr.pairings;
      let newC1, newC2;
      if (p0.winner == null || p1.winner == null) {
        newC1 = ["TBD", "TBD"];
        newC2 = ["TBD", "TBD"];
      } else {
        const c1w = p0.teams[p0.winner];
        const c1l = p0.teams[1 - p0.winner];
        const c2w = p1.teams[p1.winner];
        const c2l = p1.teams[1 - p1.winner];
        newC1 = [c1w, c2w];
        newC2 = [c1l, c2l];
      }
      const same = (a, b) => a[0] === b[0] && a[1] === b[1];
      if (!same(newC1, next.pairings[0].teams)) {
        next.pairings[0] = { teams: newC1, winner: null };
      }
      if (!same(newC2, next.pairings[1].teams)) {
        next.pairings[1] = { teams: newC2, winner: null };
      }
    }
  }

  function setScheduleMode(newMode) {
    const old = getScheduleMode();
    if (old === newMode) return;
    clearScheduleUndo();
    CONFIG.scheduleMode = newMode;
    if (newMode === "round-robin") {
      // Drop stored matches so the view recomputes from teams.
      CONFIG.matches = null;
    } else if (newMode === "king") {
      CONFIG.matches = buildKingInitial();
    } else if (newMode === "manual") {
      // Keep existing matches if any, otherwise materialize round-robin as a seed.
      if (CONFIG.matches == null) CONFIG.matches = materializeFromRoundRobin();
    }
    saveConfig(CONFIG);
  }

  function loadConfig() {
    try {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) return normalizeConfig(JSON.parse(stored));
    } catch (e) { console.warn("Bad stored config, using defaults", e); }
    return normalizeConfig(structuredClone(DEFAULT_CONFIG));
  }
  function saveConfig(cfg) {
    // Keep the per-round store consistent with the round/team counts and the
    // live board before persisting, so what's on disk always matches state
    // (e.g. after adding/removing a round, where the store grows in render()).
    // Flush the live board to the round it belongs to BEFORE reconciling: sync
    // may clamp currentRound (e.g. after removing the viewed last round), and
    // flushing after the clamp would write the board into the wrong round.
    if (cfg === CONFIG) { flushCurrentRound(); syncRoundRosters(); }
    localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg));
  }
  function clearConfig() { localStorage.removeItem(STORAGE_KEY); }

  let CONFIG = loadConfig();

  // ---- Phased rosters (per-round roster storage) ---------------------------
  // UI state: which round's rosters the board shows (0-based). Not persisted;
  // resets to 0 on reload.
  let currentRound = 0;

  function phasedOn() { return !!CONFIG.differentTeamsPerRound; }

  // Number of rounds in the resolved schedule = number of roster phases.
  function resolvedRoundCount() {
    const matches = CONFIG.matches ?? generateRoundRobin(CONFIG.teams, CONFIG.roundRobinRounds);
    return Math.max(matches.length, 1);
  }

  // Deep copy of every team's current roster (array of arrays of strings).
  function cloneRosters() { return CONFIG.teams.map(t => [...t.roster]); }

  // Push the live board (CONFIG.teams[*].roster) into the store for the round
  // currently displayed, so persistence and switching stay consistent.
  function flushCurrentRound() {
    if (!phasedOn() || !Array.isArray(CONFIG.roundRosters)) return;
    CONFIG.roundRosters[currentRound] = cloneRosters();
  }

  // Reconcile the store with the current round count and team count. Safe to
  // call on every render. New rounds copy the previous round (round 0 copies
  // the live board). New teams copy their current roster into every round.
  function syncRoundRosters() {
    if (!phasedOn()) return;
    if (!Array.isArray(CONFIG.roundRosters)) CONFIG.roundRosters = [];
    const store = CONFIG.roundRosters;
    const rounds = resolvedRoundCount();
    const teamCount = CONFIG.teams.length;
    for (let r = 0; r < rounds; r++) {
      if (!Array.isArray(store[r])) {
        store[r] = r === 0 ? cloneRosters() : store[r - 1].map(a => [...a]);
      }
      while (store[r].length < teamCount) {
        const ti = store[r].length;
        store[r].push([...CONFIG.teams[ti].roster]);
      }
      if (store[r].length > teamCount) store[r].length = teamCount;
    }
    if (store.length > rounds) store.length = rounds;
    if (currentRound >= rounds) currentRound = rounds - 1;
    if (currentRound < 0) currentRound = 0;
  }

  // Load a round's stored rosters onto the live board.
  function loadRound(r) {
    if (!phasedOn() || !Array.isArray(CONFIG.roundRosters)) return;
    const snap = CONFIG.roundRosters[r];
    if (!snap) return;
    CONFIG.teams.forEach((t, i) => { t.roster = snap[i] ? [...snap[i]] : []; });
  }

  // Switch the visible round: save the current board, load the target round.
  function switchRound(r) {
    if (r === currentRound) return;
    swapSel = null;
    // The shuffle/swap undo snapshot belongs to the round being left; applying
    // it after a switch would clobber a different round's rosters. Drop it.
    shuffleUndoStack = [];
    flushCurrentRound();
    currentRound = r;
    loadRound(r);
    saveConfig(CONFIG);
    render();
    updateUndoBtn();
  }
  let DRAFT = null; // working copy while editor is open
  let mainEditMode = false; // when true, clicks on chips open team picker instead of toggling winner
  let activePicker = null;
  let pendingIoStatus = null; // {msg, kind} surviving across renderEditor() calls
  // Snapshot of CONFIG.matches taken before a schedule reset, for one-level
  // undo. `undefined` means no undo is available. Any other schedule edit
  // invalidates it (see clearScheduleUndo()).
  let scheduleUndo = undefined;

  function materializeMatchesIfAuto() {
    if (CONFIG.matches != null) return;
    if (getScheduleMode() === "king") {
      CONFIG.matches = buildKingInitial();
    } else {
      CONFIG.matches = materializeFromRoundRobin();
    }
  }

  function clearScheduleUndo() { scheduleUndo = undefined; }

  // True if any match has a recorded winner or score.
  function scheduleHasResults() {
    if (!CONFIG.matches) return false;
    return CONFIG.matches.some(m => (m.pairings || []).some(p => {
      const pair = normalizePairing(p);
      return pair.winner != null ||
        (pair.scores && (pair.scores[0] != null || pair.scores[1] != null));
    }));
  }

  // Clear all wins and scores from the schedule (keeps the pairings).
  function resetSchedule() {
    if (!scheduleHasResults()) return;
    scheduleUndo = CONFIG.matches ? structuredClone(CONFIG.matches) : null;
    if (getScheduleMode() === "manual") {
      // Keep the hand-built pairings; just drop winner + scores.
      CONFIG.matches.forEach(m => {
        m.pairings = (m.pairings || []).map(p => {
          const pair = normalizePairing(p);
          pair.winner = null;
          pair.scores = null;
          return pair;
        });
      });
    } else if (getScheduleMode() === "king") {
      // King stores an explicit schedule; rebuild the fresh initial one.
      CONFIG.matches = buildKingInitial();
    } else {
      // Round-robin is auto-derived from teams — drop stored matches.
      CONFIG.matches = null;
    }
    saveConfig(CONFIG);
    render();
  }

  function undoScheduleReset() {
    if (scheduleUndo === undefined) return;
    CONFIG.matches = scheduleUndo ? structuredClone(scheduleUndo) : null;
    scheduleUndo = undefined;
    saveConfig(CONFIG);
    render();
  }

  function setSlotValue(roundIdx, pairingIdx, slotIdx, value) {
    clearScheduleUndo();
    materializeMatchesIfAuto();
    const pair = normalizePairing(CONFIG.matches[roundIdx].pairings[pairingIdx]);
    CONFIG.matches[roundIdx].pairings[pairingIdx] = pair;
    pair.teams[slotIdx] = value;
    if (pair.winner === slotIdx && (!value || value === "TBD")) pair.winner = null;
    recomputeKingDownstream();
    saveConfig(CONFIG);
    render();
  }

  function shuffleInPlace(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // Shuffle each position row (index 0..5) independently across all teams.
  function randomizeByPosition(teams) {
    for (let ri = 0; ri < SLOT_COUNT; ri++) {
      const names = teams
        .map(t => (t.roster[ri] ?? "").trim())
        .filter(Boolean);
      shuffleInPlace(names);
      let k = 0;
      teams.forEach(t => {
        const had = (t.roster[ri] ?? "").trim();
        t.roster[ri] = had ? (names[k++] ?? "") : "";
      });
    }
  }

  // Collect all players, shuffle, refill slots team-by-team, top to bottom.
  function randomizeFully(teams) {
    const all = [];
    teams.forEach(t => {
      for (let ri = 0; ri < SLOT_COUNT; ri++) {
        const n = (t.roster[ri] ?? "").trim();
        if (n) all.push(n);
      }
    });
    shuffleInPlace(all);
    let k = 0;
    teams.forEach(t => {
      for (let ri = 0; ri < SLOT_COUNT; ri++) {
        t.roster[ri] = k < all.length ? all[k++] : "";
      }
    });
  }

  // Undo stack for live shuffles: each entry is a snapshot of every team's
  // roster taken right before a shuffle, so repeated shuffles step back.
  let shuffleUndoStack = [];

  function snapshotRosters() {
    return CONFIG.teams.map(t => [...t.roster]);
  }

  function updateUndoBtn() {
    const btn = document.querySelector("#shuffleUndoBtn");
    if (btn) btn.classList.toggle("show", shuffleUndoStack.length > 0);
  }

  // Live shuffle from the main board: mutate CONFIG, persist, re-render.
  function shuffleLive(mode) {
    swapSel = null;
    roundsResetUndo = undefined;   // rosters change → stale reset-undo no longer applies
    shuffleUndoStack.push(snapshotRosters());
    if (mode === "position") randomizeByPosition(CONFIG.teams);
    else randomizeFully(CONFIG.teams);
    saveConfig(CONFIG);
    render();
    updateUndoBtn();
    // Brief flash so the change is obvious. The node is fresh each render,
    // so the one-shot animation replays every time.
    const teams = document.querySelector(".teams");
    if (teams) teams.classList.add("just-shuffled");
  }

  function undoShuffle() {
    swapSel = null;
    roundsResetUndo = undefined;   // rosters change → stale reset-undo no longer applies
    const snap = shuffleUndoStack.pop();
    // Discard the snapshot if the team count changed since (e.g. via the
    // editor) — restoring mismatched rosters would be wrong.
    if (snap && snap.length === CONFIG.teams.length) {
      CONFIG.teams.forEach((t, i) => { t.roster = [...snap[i]]; });
      saveConfig(CONFIG);
    }
    render();
    updateUndoBtn();
  }

  // ---- Manual swap / move on the main board (drag-drop + tap-to-swap) ----
  // A slot is identified by { team: teamIndex, slot: rosterIndex }.
  let swapSel = null;   // first slot chosen in a tap-to-swap
  let dragSrc = null;   // slot currently being dragged
  let dndActive = false;

  function slotName(loc) {
    return (CONFIG.teams[loc.team]?.roster[loc.slot] ?? "");
  }
  function setSlotName(loc, val) {
    const r = CONFIG.teams[loc.team].roster;
    while (r.length <= loc.slot) r.push("");
    r[loc.slot] = val;
  }
  function sameSlot(a, b) { return a && b && a.team === b.team && a.slot === b.slot; }

  // Swap the two players (or a player into an empty slot). Uses the shared
  // undo stack so a swap can be reverted with the Undo button.
  function swapPlayers(a, b) {
    if (!a || !b || sameSlot(a, b)) { swapSel = null; render(); return; }
    const av = slotName(a), bv = slotName(b);
    // Nothing to move between two empty slots — don't record an undo step.
    if (!av.trim() && !bv.trim()) { swapSel = null; render(); return; }
    roundsResetUndo = undefined;   // rosters change → stale reset-undo no longer applies
    shuffleUndoStack.push(snapshotRosters());
    setSlotName(a, bv);
    setSlotName(b, av);
    // Keep roster arrays tidy: drop trailing empties beyond the core slots.
    CONFIG.teams.forEach(t => {
      while (t.roster.length > CORE_SLOTS && !(t.roster[t.roster.length - 1] ?? "").trim()) {
        t.roster.pop();
      }
    });
    swapSel = null;
    saveConfig(CONFIG);
    render();
    updateUndoBtn();
  }

  function tapSlot(loc) {
    if (dndActive) return;              // ignore the click that ends a drag
    if (!swapSel) { swapSel = loc; render(); return; }
    if (sameSlot(swapSel, loc)) { swapSel = null; render(); return; }
    swapPlayers(swapSel, loc);
  }

  // Attach drag-drop + tap handlers to a roster row for the given slot.
  function wireSlot(li, loc, draggable) {
    li.classList.add("slot");
    if (sameSlot(swapSel, loc)) li.classList.add("selected");
    li.onclick = () => tapSlot(loc);
    if (draggable) {
      li.draggable = true;
      li.ondragstart = (e) => {
        dragSrc = loc; dndActive = true;
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", "");
      };
      li.ondragend = () => { dndActive = false; dragSrc = null; };
    }
    li.ondragover = (e) => { e.preventDefault(); li.classList.add("drag-over"); };
    li.ondragleave = () => li.classList.remove("drag-over");
    li.ondrop = (e) => {
      e.preventDefault();
      li.classList.remove("drag-over");
      const src = dragSrc;
      dragSrc = null; dndActive = false;   // fallback in case dragend doesn't fire
      if (src) swapPlayers(src, loc);
    };
  }

  function addTeam() {
    if (DRAFT.teams.length >= 6) return;
    const idx = DRAFT.teams.length;
    DRAFT.teams.push({
      name: "Team " + (idx + 1),
      color: COLOR_PRESETS[idx % COLOR_PRESETS.length],
      roster: ["", "", "", "", "", ""],
    });
  }

  function removeTeam(index) {
    if (DRAFT.teams.length <= 2) return;
    const removed = DRAFT.teams[index]?.name;
    DRAFT.teams.splice(index, 1);
    if (removed && Array.isArray(DRAFT.matches)) {
      DRAFT.matches.forEach(m => (m.pairings || []).forEach(p => {
        if (!p || !Array.isArray(p.teams)) return;
        p.teams.forEach((t, i) => {
          if (t === removed) {
            p.teams[i] = "TBD";
            if (p.winner === i) p.winner = null;
          }
        });
      }));
    }
  }

  function setMatchScore(roundIdx, pairingIdx, scoreA, scoreB) {
    clearScheduleUndo();
    materializeMatchesIfAuto();
    const pair = normalizePairing(CONFIG.matches[roundIdx].pairings[pairingIdx]);
    CONFIG.matches[roundIdx].pairings[pairingIdx] = pair;
    pair.scores = normalizeScores([scoreA, scoreB]);
    saveConfig(CONFIG);
    render();
  }

  function clearMatchFromMain(roundIdx, pairingIdx) {
    clearScheduleUndo();
    materializeMatchesIfAuto();
    CONFIG.matches[roundIdx].pairings[pairingIdx] = { teams: ["TBD", "TBD"], winner: null };
    recomputeKingDownstream();
    saveConfig(CONFIG);
    render();
  }

  function addRoundFromMain() {
    clearScheduleUndo();
    roundsResetUndo = undefined;   // round count changes → stale reset-undo no longer applies
    // In round-robin mode, adding a round extends (loops) the round-robin
    // rather than dropping to manual: bump the round count and re-derive.
    if (getScheduleMode() === "round-robin") {
      const current = generateRoundRobin(CONFIG.teams, CONFIG.roundRobinRounds).length;
      CONFIG.roundRobinRounds = current + 1;
      saveConfig(CONFIG);
      render();
      return;
    }
    materializeMatchesIfAuto();
    const nextRoundNumber = CONFIG.matches.length + 1;
    CONFIG.matches.push({
      round: nextRoundNumber,
      pairings: CONFIG.courts.map(() => ({ teams: ["TBD", "TBD"], winner: null })),
    });
    recomputeKingDownstream();
    saveConfig(CONFIG);
    render();
  }

  // Round-robin only: shrink the schedule by one round (down to a minimum
  // of one). Sets an explicit round count so the derived schedule respects it.
  function removeRoundFromMain() {
    if (getScheduleMode() !== "round-robin") return;
    clearScheduleUndo();
    roundsResetUndo = undefined;   // round count changes → stale reset-undo no longer applies
    const current = generateRoundRobin(CONFIG.teams, CONFIG.roundRobinRounds).length;
    if (current <= 1) return;
    CONFIG.roundRobinRounds = current - 1;
    saveConfig(CONFIG);
    render();
  }

  function closeTeamPicker() {
    if (!activePicker) return;
    activePicker.remove();
    document.removeEventListener("mousedown", outsidePickerHandler, true);
    document.removeEventListener("keydown", pickerKeyHandler, true);
    activePicker = null;
  }
  function outsidePickerHandler(e) {
    if (activePicker && !activePicker.contains(e.target)) closeTeamPicker();
  }
  function pickerKeyHandler(e) {
    if (e.key === "Escape") closeTeamPicker();
  }

  function openTeamPicker(anchorEl, currentValue, onPick) {
    closeTeamPicker();
    const picker = el("div", { class: "team-picker" });
    const opts = [
      { value: "TBD", label: "TBD", color: null, cls: "tbd-row" },
      ...CONFIG.teams.map(t => ({ value: t.name, label: t.name, color: t.color, cls: "has-color" })),
    ];
    for (const o of opts) {
      const isSelected = (currentValue ?? "") === o.value;
      const item = el("div", {
        class: "team-picker-item " + o.cls + (isSelected ? " selected" : ""),
        onclick: (e) => { e.stopPropagation(); closeTeamPicker(); onPick(o.value); },
      });
      if (o.color) item.style.setProperty("--picker-color", o.color);
      item.appendChild(el("span", { class: "picker-dot" }));
      item.appendChild(el("span", {}, o.label));
      picker.appendChild(item);
    }
    document.body.appendChild(picker);

    const rect = anchorEl.getBoundingClientRect();
    const pRect = picker.getBoundingClientRect();
    let left = rect.left;
    let top = rect.bottom + 6;
    if (left + pRect.width > window.innerWidth - 8) left = window.innerWidth - pRect.width - 8;
    if (top + pRect.height > window.innerHeight - 8) top = rect.top - pRect.height - 6;
    if (left < 8) left = 8;
    if (top < 8) top = 8;
    picker.style.left = left + "px";
    picker.style.top = top + "px";

    activePicker = picker;
    setTimeout(() => {
      document.addEventListener("mousedown", outsidePickerHandler, true);
      document.addEventListener("keydown", pickerKeyHandler, true);
    }, 0);
  }

  // Popover to set both teams' final score for a match at once.
  function openScorePicker(anchorEl, pair, onSave) {
    closeTeamPicker();
    const picker = el("div", { class: "team-picker score-picker" },
      el("div", { class: "score-picker-title" }, "Final score"));

    const inputs = [];
    pair.teams.forEach((name, i) => {
      const t = teamByName(name);
      const color = t ? t.color : "var(--accent)";
      const inp = el("input", {
        type: "number", inputmode: "numeric", min: "0",
        value: pair.scores?.[i] == null ? "" : String(pair.scores[i]),
        placeholder: "0",
        class: "score-input",
      });
      inputs.push(inp);
      const dot = el("span", { class: "picker-dot", style: { "--picker-color": color } });
      picker.appendChild(el("label", { class: "score-picker-row" },
        dot,
        el("span", { class: "score-picker-name" }, name),
        inp,
      ));
    });

    const save = () => { closeTeamPicker(); onSave(inputs[0].value, inputs[1].value); };
    picker.appendChild(el("div", { class: "score-picker-actions" },
      el("button", { class: "btn ghost", type: "button",
        onclick: (e) => { e.stopPropagation(); closeTeamPicker(); onSave("", ""); } }, "Clear"),
      el("button", { class: "btn", type: "button",
        onclick: (e) => { e.stopPropagation(); save(); } }, "Save"),
    ));
    picker.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); save(); }
    });
    document.body.appendChild(picker);

    const rect = anchorEl.getBoundingClientRect();
    const pRect = picker.getBoundingClientRect();
    let left = rect.left + rect.width / 2 - pRect.width / 2;
    let top = rect.bottom + 6;
    if (left + pRect.width > window.innerWidth - 8) left = window.innerWidth - pRect.width - 8;
    if (top + pRect.height > window.innerHeight - 8) top = rect.top - pRect.height - 6;
    if (left < 8) left = 8;
    if (top < 8) top = 8;
    picker.style.left = left + "px";
    picker.style.top = top + "px";

    activePicker = picker;
    setTimeout(() => {
      document.addEventListener("mousedown", outsidePickerHandler, true);
      document.addEventListener("keydown", pickerKeyHandler, true);
      inputs[0].focus();
      inputs[0].select();
    }, 0);
  }

  // ============ HELPERS ============
  const $ = (sel, root = document) => root.querySelector(sel);
  const el = (tag, attrs = {}, ...children) => {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "style") {
        for (const [sk, sv] of Object.entries(v)) {
          if (sk.startsWith("--")) node.style.setProperty(sk, sv);
          else node.style[sk] = sv;
        }
      }
      else if (k === "class") node.className = v;
      else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, v);
    }
    for (const c of children.flat()) {
      if (c == null || c === false) continue;
      node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    }
    return node;
  };
  const teamByName = (name) => CONFIG.teams.find(t => t.name === name);

  // All orderings of [0..n-1]; used to try every pairing→court assignment.
  function permutations(n) {
    if (n <= 1) return [[0].slice(0, n)];
    const base = permutations(n - 1);
    const out = [];
    for (const p of base) {
      for (let i = 0; i < n; i++) {
        const q = p.slice();
        q.splice(i, 0, n - 1);
        out.push(q);
      }
    }
    return out;
  }

  // Balance court usage across a schedule. The circle method always parks the
  // "fixed" team in pairing slot 0, so left as-is one team would sit on Court 1
  // every round. This reassigns each round's pairings to courts greedily,
  // keeping every team's time spread as evenly as possible over all courts.
  // A single odd round-robin cycle can't be perfectly even (each team plays an
  // odd number of games), but looping more rounds evens it right out.
  function balanceCourts(rounds) {
    const counts = new Map(); // team -> [countPerCourtSlot]
    const get = (t, c) => (counts.get(t) || [])[c] || 0;
    const add = (t, c, d) => {
      let a = counts.get(t);
      if (!a) { a = []; counts.set(t, a); }
      a[c] = (a[c] || 0) + d;
    };
    for (const r of rounds) {
      const ps = r.pairings;
      if (ps.length < 2) continue; // nothing to reorder (0 or 1 game)
      const perms = permutations(ps.length);
      let best = null, bestMax = Infinity, bestSpread = Infinity;
      for (const perm of perms) {
        // Score this assignment: keep the busiest single team-court low, then
        // minimize overall spread (sum of squares of per-team court counts).
        let mx = 0, spread = 0;
        for (let c = 0; c < perm.length; c++) {
          for (const t of ps[perm[c]].teams) {
            const nc = get(t, c) + 1;
            mx = Math.max(mx, nc);
            spread += nc * nc - (nc - 1) * (nc - 1); // marginal Σcount²
          }
        }
        if (mx < bestMax || (mx === bestMax && spread < bestSpread)) {
          bestMax = mx; bestSpread = spread; best = perm;
        }
      }
      for (let c = 0; c < best.length; c++)
        for (const t of ps[best[c]].teams) add(t, c, 1);
      r.pairings = best.map(idx => ps[idx]);
    }
    return rounds;
  }

  // Generate a round-robin schedule via the circle method.
  //   numRounds: how many rounds to produce. Defaults to a single full
  //   round-robin (n-1 rounds, each team plays each other once). Asking for
  //   more than that keeps rotating and simply loops the pairings — the
  //   rotation is cyclic with period n-1, so round n repeats round 1, etc.
  function generateRoundRobin(teams, numRounds) {
    const names = teams.map(t => t.name);
    if (names.length < 2) return [];
    // Circle method. Add a dummy "bye" slot for odd counts; pairings that
    // involve it are dropped, so that team sits the round out.
    const list = names.slice();
    if (list.length % 2 === 1) list.push(null);
    const n = list.length;
    const half = n / 2;
    const fullCycle = n - 1;
    const total = (numRounds && numRounds > 0) ? Math.floor(numRounds) : fullCycle;
    let row = list.slice();
    const rounds = [];
    for (let r = 0; r < total; r++) {
      const pairings = [];
      for (let i = 0; i < half; i++) {
        const a = row[i];
        const b = row[n - 1 - i];
        if (a !== null && b !== null) pairings.push({ teams: [a, b], winner: null });
      }
      rounds.push({ round: r + 1, pairings });
      // Rotate all but the first element clockwise by one.
      const fixed = row[0];
      const rest = row.slice(1);
      rest.unshift(rest.pop());
      row = [fixed, ...rest];
    }
    return balanceCourts(rounds);
  }

  // ============ RENDER ============
  function deriveWeekday(dateStr) {
    if (!dateStr) return "";
    const d = new Date(dateStr);
    if (Number.isNaN(d.getTime())) return "";
    return d.toLocaleDateString(undefined, { weekday: "long" });
  }

  function renderHeader() {
    const titleBlock = el("div", { class: "title-block" },
      el("div", { class: "title" }, CONFIG.sessionTitle),
      CONFIG.subtitle ? el("div", { class: "subtitle" }, CONFIG.subtitle) : null,
    );

    const weekday = deriveWeekday(CONFIG.date);
    const dateBlock = el("div", { class: "date-block" });
    if (weekday) dateBlock.appendChild(el("div", { class: "weekday" }, weekday));
    if (CONFIG.date) dateBlock.appendChild(el("div", { class: "date" }, CONFIG.date));

    return el("header", { class: "header" }, titleBlock, dateBlock);
  }

  function computeWinTotals() {
    const totals = Object.fromEntries(CONFIG.teams.map(t => [t.name, 0]));
    const matches = CONFIG.matches ?? generateRoundRobin(CONFIG.teams, CONFIG.roundRobinRounds);
    for (const m of matches) {
      for (const p of (m.pairings || [])) {
        const pair = normalizePairing(p);
        if (pair.winner == null) continue;
        const winnerName = pair.teams[pair.winner];
        if (winnerName in totals) totals[winnerName]++;
      }
    }
    return totals;
  }

  function subsFilled(t) {
    let n = 0;
    for (let i = CORE_SLOTS; i < SLOT_COUNT; i++) if ((t.roster[i] ?? "").trim()) n++;
    return n;
  }

  function renderTeams() {
    const anySubs = CONFIG.teams.some(t => subsFilled(t) > 0);
    const wrap = el("section", { class: "teams" + (anySubs ? " dense" : ""),
      style: { "--team-cols": Math.max(CONFIG.teams.length, 1) } });
    const wins = computeWinTotals();
    CONFIG.teams.forEach((t, ti) => {
      const roster = el("ul", { class: "roster" });
      const addRow = (i, name, extraCls) => {
        const badge = el("span", { class: "pos-badge" + (i >= CORE_SLOTS ? " sub" : "") }, posLabel(i));
        const li = name
          ? el("li", { class: extraCls || "" }, el("span", { class: "player-name" }, name), badge)
          : el("li", { class: "empty " + (extraCls || "") }, el("span", { class: "player-name" }, "—"), badge);
        wireSlot(li, { team: ti, slot: i }, !!name);
        roster.appendChild(li);
      };
      // 6 fixed positions always shown.
      for (let i = 0; i < CORE_SLOTS; i++) addRow(i, t.roster[i]);
      // Bench: show only filled subs. Adding a sub is done in the editor.
      for (let i = CORE_SLOTS; i < SLOT_COUNT; i++) {
        if ((t.roster[i] ?? "").trim()) addRow(i, t.roster[i]);
      }
      const card = el("div", { class: "team", style: { "--team-color": t.color } },
        el("div", { class: "team-header" },
          el("span", { class: "team-name" }, t.name),
          el("span", { class: "team-wins", title: `${wins[t.name] ?? 0} win${(wins[t.name] ?? 0) === 1 ? "" : "s"}` },
            el("span", { class: "wins-label" }, "🏆"),
            el("span", { class: "wins-num" }, String(wins[t.name] ?? 0)),
          ),
        ),
        roster
      );
      wrap.appendChild(card);
    });
    return wrap;
  }

  function toggleWinnerFromMain(roundIdx, pairingIdx, slotIdx) {
    clearScheduleUndo();
    materializeMatchesIfAuto();
    const pair = normalizePairing(CONFIG.matches[roundIdx].pairings[pairingIdx]);
    CONFIG.matches[roundIdx].pairings[pairingIdx] = pair;
    pair.winner = pair.winner === slotIdx ? null : slotIdx;
    recomputeKingDownstream();
    saveConfig(CONFIG);
    render();
  }

  // Slot value: "" (blank), "TBD", or a team name.
  // onClick: if present, slot becomes clickable (and blank/TBD slots get a "clickable" hover).
  function renderSlot(value, isWinner, onClick, opts = {}) {
    if (!value) {
      const attrs = { class: "blank" + (onClick ? " clickable" : "") };
      if (onClick) { attrs.onclick = onClick; attrs.title = "Click to add a team"; }
      return el("span", attrs, onClick ? "+" : "—");
    }
    if (value === "TBD") {
      const attrs = { class: "tbd-chip" + (onClick ? " clickable" : "") };
      if (onClick) { attrs.onclick = onClick; attrs.title = "Click to change"; }
      return el("span", attrs, "TBD");
    }
    const t = teamByName(value);
    const color = t ? t.color : "var(--accent)";
    const attrs = {
      class: "team-chip" + (isWinner ? " winner" : ""),
      style: { "--team-color": color },
    };
    if (onClick) {
      attrs.onclick = onClick;
      attrs.title = opts.titleOverride
        ?? (isWinner ? `Click to unmark ${value} as winner` : `Click to mark ${value} as winner`);
    }
    const chip = el("span", attrs);
    chip.appendChild(el("span", { class: "team-dot" }));
    chip.appendChild(el("span", {}, value));
    if (!isWinner) return chip;
    // Winners get a trophy sitting outside the colored border of the chip.
    return el("span", { class: "winner-slot" },
      el("span", { class: "trophy" }, "🏆"),
      chip,
    );
  }

  function renderSchedule() {
    const matches = CONFIG.matches ?? generateRoundRobin(CONFIG.teams, CONFIG.roundRobinRounds);
    const courts = CONFIG.courts;
    const editing = mainEditMode;

    // Some schedules (e.g. a 6-team round-robin) have more games per round
    // than there are named courts. Render one column per game, labeling any
    // overflow columns generically.
    const maxGames = matches.reduce((mx, m) => Math.max(mx, (m.pairings || []).length), 0);
    const colCount = Math.max(courts.length, maxGames);
    const colName = (i) => courts[i] || ("Court " + (i + 1));

    const grid = el("div", { class: "schedule",
      style: { "--court-count": colCount } });

    grid.appendChild(el("div", { class: "sched-head" }, "Round"));
    for (let i = 0; i < colCount; i++)
      grid.appendChild(el("div", { class: "sched-head" + (i > 0 ? " court-divide" : "") }, colName(i)));

    matches.forEach((m, ri) => {
      grid.appendChild(el("div", { class: "sched-cell sched-round" }, "R" + m.round));
      for (let i = 0; i < colCount; i++) {
        const raw = m.pairings[i];
        const pair = raw ? normalizePairing(raw) : { teams: ["", ""], winner: null, scores: null };
        const [a, b] = pair.teams;

        const divideCls = i > 0 ? " court-divide" : "";
        const courtName = colName(i);

        // In broadcast (non-editing) mode, fully-empty matches collapse to a single em-dash.
        if (!editing && !a && !b) {
          grid.appendChild(el("div", { class: "sched-cell match-blank" + divideCls, "data-court": courtName }, "—"));
          continue;
        }

        const cell = el("div", { class: "sched-cell match" + divideCls, "data-court": courtName });

        function slotClick(slotIdx) {
          return (e) => {
            e.stopPropagation();
            const cur = pair.teams[slotIdx];
            if (editing) {
              openTeamPicker(e.currentTarget, cur,
                v => setSlotValue(ri, i, slotIdx, v));
            } else if (cur && cur !== "TBD") {
              toggleWinnerFromMain(ri, i, slotIdx);
            }
          };
        }

        // In edit mode, every slot (incl. blank and TBD) is clickable.
        // In broadcast mode, only real team chips are clickable (for winner).
        const clickA = editing ? slotClick(0) : ((a && a !== "TBD") ? slotClick(0) : null);
        const clickB = editing ? slotClick(1) : ((b && b !== "TBD") ? slotClick(1) : null);

        const titleOverride = editing ? "Click to change team" : undefined;

        // Center element: the final score (when set) or a "vs". Editable when
        // both sides hold real teams — clicking opens a score popover. Editing
        // auto-materializes the schedule, so it works in every mode.
        const bothReal = a && a !== "TBD" && b && b !== "TBD";
        const hasScore = pair.scores && (pair.scores[0] != null || pair.scores[1] != null);
        let center;
        if (hasScore) {
          const num = (v, win) => el("span",
            { class: "score-num" + (win ? " win" : "") },
            v == null ? "–" : String(v));
          center = el("span", { class: "score-box" + (bothReal ? " clickable" : "") },
            num(pair.scores[0], pair.winner === 0),
            el("span", { class: "score-dash" }, "–"),
            num(pair.scores[1], pair.winner === 1),
          );
        } else {
          center = el("span", { class: "vs" + (bothReal ? " clickable" : "") }, "vs");
        }
        if (bothReal) {
          center.title = "Click to set the final score";
          center.onclick = (e) => {
            e.stopPropagation();
            openScorePicker(e.currentTarget, pair,
              (sa, sb) => setMatchScore(ri, i, sa, sb));
          };
        }

        cell.appendChild(renderSlot(a, pair.winner === 0, clickA, { titleOverride }));
        cell.appendChild(center);
        cell.appendChild(renderSlot(b, pair.winner === 1, clickB, { titleOverride }));

        if (editing) {
          cell.appendChild(el("button", {
            class: "clear-match-btn",
            title: "Clear this match",
            onclick: (e) => { e.stopPropagation(); clearMatchFromMain(ri, i); },
          }, "×"));
        }

        grid.appendChild(cell);
      }
    });

    const mode = getScheduleMode();
    const canEditLineups = mode === "manual";

    // + button sits in the Round column, right below the last round number.
    grid.appendChild(el("button", {
      class: "add-round-main",
      title: mode === "round-robin" ? "Add another round (loops the round-robin)" : "Add another round",
      onclick: () => addRoundFromMain(),
    }, "+"));

    // In round-robin, allow trimming looped rounds back down.
    if (mode === "round-robin" && matches.length > 1) {
      grid.appendChild(el("button", {
        class: "add-round-main",
        title: "Remove the last round",
        onclick: () => removeRoundFromMain(),
      }, "−"));
    }

    const canUndoReset = scheduleUndo !== undefined;
    return el("section", { class: "panel" },
      el("div", { class: "panel-head" },
        el("div", { class: "panel-title" }, "Match Schedule"),
        el("div", { class: "panel-actions" },
          // Lineup editing only applies in Manual mode, so the button is only
          // shown there (pairings are auto-derived in round-robin / king).
          canEditLineups ? el("button", {
            class: "edit-lineups-btn" + (editing ? " active" : ""),
            title: editing ? "Stop editing" : "Edit team lineups",
            onclick: () => {
              mainEditMode = !mainEditMode;
              closeTeamPicker();
              render();
            },
          }, editing ? "Done" : "Edit lineups") : null,
          canUndoReset ? el("button", {
            class: "edit-lineups-btn",
            title: "Undo the schedule reset",
            onclick: () => undoScheduleReset(),
          }, "↩ Undo") : null,
          scheduleHasResults() ? el("button", {
            class: "edit-lineups-btn",
            title: "Clear all wins and scores",
            onclick: () => resetSchedule(),
          }, "Reset scores") : null,
        ),
      ),
      grid,
    );
  }

  function renderRules() {
    const list = el("ul", { class: "rules" });
    for (const r of CONFIG.rules) list.appendChild(el("li", {}, r));
    return el("section", { class: "panel" },
      el("div", { class: "panel-title" }, "Rules"),
      list
    );
  }

  // Snapshot of roundRosters taken before a "Reset rounds", for one-level undo.
  // `undefined` means no undo is available.
  let roundsResetUndo = undefined;

  // Reset every round to a copy of Round 1's rosters.
  function resetRounds() {
    if (!phasedOn()) return;
    flushCurrentRound();
    syncRoundRosters();
    roundsResetUndo = structuredClone(CONFIG.roundRosters);
    const base = CONFIG.roundRosters[0].map(a => [...a]);
    CONFIG.roundRosters = CONFIG.roundRosters.map(() => base.map(a => [...a]));
    loadRound(currentRound);
    saveConfig(CONFIG);
    render();
  }

  function undoResetRounds() {
    if (roundsResetUndo === undefined) return;
    CONFIG.roundRosters = structuredClone(roundsResetUndo);
    roundsResetUndo = undefined;
    loadRound(currentRound);
    saveConfig(CONFIG);
    render();
  }

  function renderRoundTabs() {
    const rounds = resolvedRoundCount();
    const bar = el("div", { class: "round-tabs" });
    for (let r = 0; r < rounds; r++) {
      bar.appendChild(el("button", {
        class: "round-tab" + (r === currentRound ? " active" : ""),
        onclick: () => switchRound(r),
      }, "Round " + (r + 1)));
    }
    bar.appendChild(el("button", {
      class: "round-tab reset",
      title: "Reset all rounds to copies of Round 1",
      onclick: () => resetRounds(),
    }, "↺ Reset rounds"));
    if (roundsResetUndo !== undefined) {
      bar.appendChild(el("button", {
        class: "round-tab",
        title: "Undo the round reset",
        onclick: () => undoResetRounds(),
      }, "↩ Undo"));
    }
    return bar;
  }

  function render() {
    closeTeamPicker();
    if (phasedOn()) { syncRoundRosters(); loadRound(currentRound); }
    const stage = $("#stage");
    stage.innerHTML = "";
    stage.appendChild(renderHeader());
    if (phasedOn()) {
      stage.appendChild(el("div", { class: "teams-block" },
        renderRoundTabs(), renderTeams()));
    } else {
      stage.appendChild(renderTeams());
    }
    stage.appendChild(el("div", { class: "bottom" }, renderRules(), renderSchedule()));
  }

  // ============ EDITOR ============

    DRAFT = structuredClone(CONFIG);
